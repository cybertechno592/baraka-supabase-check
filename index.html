<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#123c31">
<title>Baraka · Stock and Sales</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" onerror="window.__barakaSupabaseLoadFailed=true;this.onerror=function(){window.__barakaSupabaseLoadFailed=true};this.src='https://unpkg.com/@supabase/supabase-js@2'"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.3/dist/JsBarcode.all.min.js"></script>
<script src="https://unpkg.com/@zxing/browser@0.2.1"></script>
<style>
:root{--g:#123c31;--g2:#1e614d;--lime:#d9ed78;--paper:#f3f6f1;--ink:#18231f;--muted:#718078;--line:#e1e8e1;--white:#fff;--red:#a33a2a;--amber:#8d6410}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,"Segoe UI",sans-serif}.top{background:var(--g);color:#fff;padding:14px max(16px,calc((100vw - 1180px)/2));display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;letter-spacing:.04em}.top small{color:#d5e2d8}.wrap{max-width:1180px;margin:auto;padding:22px 16px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:12px 0}.login{max-width:480px;margin:6vh auto}.muted,.small{color:var(--muted)}.small{font-size:12px}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:11px;color:var(--muted);font-weight:850;letter-spacing:.06em}.field input,.field select,.field textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;font:inherit;background:#fff;color:var(--ink)}.btn{border:0;border-radius:9px;padding:10px 14px;background:var(--g);color:#fff;font:inherit;font-weight:800;cursor:pointer}.btn:hover{background:var(--g2)}.btn:disabled{opacity:.5;cursor:wait}.light{background:#eaf0e9;color:var(--g)}.danger{background:#f8e9e6;color:#8b291c}.sm{padding:6px 9px;font-size:12px}.tabs,.row,.inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.tabs{border-bottom:1px solid var(--line);padding-bottom:8px;margin:12px 0 18px}.tab{border:0;background:transparent;border-radius:8px;padding:9px 12px;cursor:pointer;font:inherit;font-weight:750;color:var(--muted)}.tab.active{background:#e4eee3;color:var(--g)}.between,.section{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.section{margin:18px 0 10px}.section h2,.section h3{margin:0}.section p{margin:3px 0;color:var(--muted);font-size:13px}.grid2,.grid3,.branchgrid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.branchgrid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:26px;font-weight:900}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:30px;background:#eef2ec;font-size:11px;font-weight:800}.good{background:#e4f2e6;color:#24603d}.warn{background:#fff3d5;color:#785900}.bad{background:#f8e9e6;color:#9b3022}.stock-orange{background:#ffe3ca;color:#93410b}.notice{background:#fbf6d9;border:1px solid #eadf9c;border-radius:11px;padding:11px;color:#5f5417;font-size:13px}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.code{font-family:ui-monospace,Consolas,monospace;font-weight:800}.hidden{display:none!important}.status{min-height:22px;font-weight:750;margin-top:8px}.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:14px;z-index:10}.modal{background:#fff;border-radius:16px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}.welcome{background:linear-gradient(110deg,#eff5e9,#f7f9e6);border-left:5px solid var(--lime);border-radius:12px;padding:12px 16px;margin:8px 0 16px;color:var(--ink);font-weight:650}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#20382f;color:#fff;padding:11px 16px;border-radius:30px;z-index:20;box-shadow:0 5px 20px #0003}.label-sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.product-label{border:1px dashed #777;padding:10px;text-align:center;break-inside:avoid}.product-label svg{max-width:100%}video{width:100%;max-height:55vh;background:#111;border-radius:10px}.category{margin-top:20px}.category h3{background:#eaf0e7;border-left:4px solid var(--lime);padding:8px 11px;border-radius:8px}.searchrow{display:flex;gap:8px;flex-wrap:wrap}.searchrow>*{flex:1;min-width:170px}.stock-table th,.stock-table td{text-align:right}.stock-table th:first-child,.stock-table td:first-child{text-align:left}.stock-table tfoot{font-weight:900;background:#f3f6f1}.stock-total{font-size:18px;font-weight:900;color:var(--g)}@media(max-width:650px){.wrap{padding:14px 10px}.grid2,.grid3{grid-template-columns:1fr}.top{padding:12px}.table{min-width:820px}.tabs{overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.label-sheet{grid-template-columns:repeat(2,1fr)}}@media print{body{background:#fff}.top,.wrap>*:not(#printArea),#app,.modalback,.toast{display:none!important}#printArea{display:block!important}.product-label{border:1px dashed #555}}
</style>
</head>
<body>
<header class="top"><div><div class="brand">BARAKA · STOCK & SALES</div><small id="topSub">Secure branch records</small></div><div class="inline"><span id="userBadge" class="small"></span><button id="logout" class="btn light hidden" onclick="logout()">Sign out</button></div></header>
<main class="wrap">
<section id="loginCard" class="card login"><h1 style="margin:0">Sign in to Baraka</h1><p class="muted">Use the login ID and password given to you by your Admin.</p><div class="field"><label>LOGIN ID</label><input id="loginId" name="baraka-login-entry" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"></div><div class="field"><label>PASSWORD</label><input id="password" name="baraka-password-entry" type="password" autocomplete="off"></div><button id="loginBtn" class="btn" style="width:100%" onclick="login()">Sign in</button><div id="loginStatus" class="status"></div><div class="notice" style="margin-top:14px">Use only the official Baraka link. Never share your password or Supabase service key.</div></section>
<section id="app" class="hidden"><div class="section"><div><h1 id="welcome" style="margin:0">Baraka</h1><p id="identity" class="muted" style="margin:3px 0"></p></div><span class="badge" id="branchLabel"></span></div><div class="welcome" id="welcomeMessage"></div><nav class="tabs" id="tabs"></nav><div id="content"></div></section>
</main>
<div id="modal"></div><div id="toastRoot"></div><div id="printArea" class="hidden"></div>
<script>
const PROJECT_URL='https://xaxtnvpnbrsevedhbmly.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_0E5DHXzQu9iWbZ2K983lBA_vvutWdgP';
let db=null;try{if(window.supabase?.createClient)db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);else console.error('Supabase browser library did not load.')}catch(e){console.error('Supabase client could not start.',e)}
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>'KES '+Number(x||0).toLocaleString('en-KE');
const cats=['Gas','Accessories','Electricals'];
const normCategory=x=>String(x??'').trim().toLowerCase();
let sessionUser=null, profile=null, tenant=null, branches=[], products=[], stocks=[], staff=[], sales=[], customers=[], submissions=[], closures=[], tenants=[], activeTab='', isSuper=false, stockBranchId='', stockGasSize=null;
const say=(id,msg,ok=false)=>{const e=$(id);if(e){e.textContent=msg;e.className='status '+(ok?'good':'bad')}};
if(!db)say('loginStatus',window.__barakaSupabaseLoadFailed?'Sign-in connection did not load. Check internet and reload this page.':'Sign-in connection is unavailable in this page. Open the official Baraka website and reload.');
function toast(s){$('toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('toastRoot').replaceChildren(),2800)}
function fail(e){console.error(e);toast(e?.message||'Something went wrong. Please try again.')}
// Baraka business dates follow Kenya time, not UTC, so yesterday's submission cannot lock today's sales.
function today(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Nairobi',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${v.year}-${v.month}-${v.day}`}
let lastBusinessDate=today();
const branchById=id=>branches.find(b=>b.id===id), branchName=id=>branchById(id)?.name||'—', productById=id=>products.find(p=>p.id===id), staffById=id=>staff.find(s=>s.user_id===id);
function qtyAt(pid,bid){return Number(stocks.find(x=>x.product_id===pid&&x.branch_id===bid)?.quantity||0)}
function emptyAt(pid,bid){return Number(stocks.find(x=>x.product_id===pid&&x.branch_id===bid)?.empty_quantity||0)}
function status(s){if(s.cancelled_at)return'Cancelled';if(!s.paid)return'Awaiting payment';if(s.kind==='Gas refill'&&!s.empty_returned)return'Awaiting empty cylinder';return'Complete'}
function badge(s){const x=status(s);return `<span class="badge ${x==='Complete'?'good':x==='Awaiting payment'?'bad':'warn'}">${x}</span>`}
async function login(){const b=$('loginBtn'),loginId=$('loginId').value.trim().toUpperCase(),password=$('password').value;if(!loginId||!password){say('loginStatus','Enter your login ID and password.');return}if(!db){say('loginStatus',window.__barakaSupabaseLoadFailed?'Baraka could not load its sign-in connection. Check internet, then reload the official website.':'Sign-in is not ready in this page. Open the official Baraka website and reload it.');return}b.disabled=true;b.textContent='Checking…';say('loginStatus','Connecting securely to Baraka…',true);try{const {data,error}=await db.functions.invoke('login-by-id',{body:{loginId,password}});if(error){let detail='';try{const body=error.context&&typeof error.context.json==='function'?await error.context.json():null;detail=body?.error||body?.message||''}catch{}throw new Error(detail||error.message||'The sign-in service could not be reached.')}if(!data?.access_token)throw new Error(data?.error||'The sign-in service did not return a login session. Check that the login ID and password are correct.');say('loginStatus','Login accepted. Loading your branch…',true);const {error:se}=await db.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(se)throw se;const {data:{user},error:ue}=await db.auth.getUser();if(ue||!user)throw new Error('Login was accepted, but Baraka could not confirm the account.');const {data:p,error:pe}=await db.from('profiles').select('*').eq('user_id',user.id).single();if(pe||!p)throw new Error('Login was accepted, but no staff profile was found. Ask the Admin to check this staff account.');profile=p;sessionUser=user;isSuper=p.login_id==='SUPER-ADMIN-001';await loadData();showApp()}catch(e){if(db?.auth){try{await db.auth.signOut()}catch{}}fail(e);say('loginStatus',e.message||'Login failed.')}finally{b.disabled=false;b.textContent='Sign in'}}
async function loadData(){const t=await db.from('tenants').select('id,name').eq('id',profile.tenant_id).single();if(t.error)throw t.error;tenant=t.data;let q=(name,columns='*')=>db.from(name).select(columns).eq('tenant_id',profile.tenant_id);let profilesQuery=db.from('profiles').select('*');if(!isSuper)profilesQuery=profilesQuery.eq('tenant_id',profile.tenant_id);const results=await Promise.all([db.from('branches').select('*').eq('tenant_id',profile.tenant_id).eq('active',true).order('name'),q('products'),q('branch_stock'),profilesQuery,q('sales'),q('customers'),q('daily_submissions'),q('daily_closures')]);for(const r of results)if(r.error)throw r.error;[branches,products,stocks,staff,sales,customers,submissions,closures]=results.map(r=>r.data||[]);if(isSuper){const tr=await db.from('tenants').select('id,name').order('name');if(!tr.error)tenants=tr.data||[]}}
function tabsFor(){if(profile.role==='Admin')return [...(isSuper?['Client businesses']:[]),'Overview','Stock','Sales','Customers','Daily close','Staff'];if(profile.role==='Sales Representative')return['New sale','My branch sales','Stock','Submit day'];if(profile.role==='Delivery Assistant')return['My deliveries'];return[]}
function showApp(){ $('loginCard').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('topSub').textContent=tenant.name+' · shared secure records';$('welcome').textContent=profile.role==='Admin'?'Admin workspace':profile.role==='Sales Representative'?'Sales workspace':'Delivery workspace';$('identity').textContent=profile.full_name+' · '+profile.login_id+' · '+(isSuper?'Super Admin':profile.role);$('welcomeMessage').textContent=profile.role==='Admin'?`Welcome, ${profile.full_name}. Your leadership keeps every Baraka branch moving forward.`:profile.role==='Sales Representative'?`Welcome, ${profile.full_name}. Every customer you serve helps Baraka grow.`:`Welcome, ${profile.full_name}. Your safe and reliable deliveries make a difference.`;$('branchLabel').textContent=profile.role==='Admin'?'All branches':branchName(profile.branch_id);activeTab=activeTab&&tabsFor().includes(activeTab)?activeTab:tabsFor()[0];render()}
function render(){const ts=tabsFor();$('tabs').innerHTML=ts.map(x=>`<button class="tab ${x===activeTab?'active':''}" onclick="go('${esc(x)}')">${esc(x)}</button>`).join('');$('content').innerHTML=page(activeTab);bindPage()}
function go(t){activeTab=t;render()}
async function refresh(){await loadData();render()}
// Clear all app-side sign-in fields after logout; autocomplete settings discourage browser suggestions.
async function logout(){try{if(db?.auth)await db.auth.signOut()}finally{sessionUser=null;profile=null;tenant=null;branches=[];products=[];stocks=[];staff=[];sales=[];customers=[];submissions=[];closures=[];tenants=[];activeTab='';$('app').classList.add('hidden');$('loginCard').classList.remove('hidden');$('logout').classList.add('hidden');$('loginId').value='';$('password').value='';say('loginStatus','Signed out.',true)}}
function page(t){if(t==='Client businesses')return clientPage();if(t==='Overview')return overviewPage();if(t==='Stock')return stockPage();if(t==='Sales')return salesPage();if(t==='Customers')return customersPage();if(t==='Daily close')return closePage();if(t==='Staff')return staffPage();if(t==='New sale')return newSalePage();if(t==='My branch sales')return repSalesPage();if(t==='Submit day')return submitPage();return deliveryPage()}
function overviewPage(){let td=sales.filter(s=>s.sale_date===today()&&!s.cancelled_at),inc=sales.filter(s=>!s.cancelled_at&&status(s)!=='Complete');return `<div class="grid3"><div class="card kpi"><div class="label">Products</div><div class="value">${products.length}</div></div><div class="card kpi"><div class="label">Sales today</div><div class="value">${td.length}</div><div class="small">${money(td.reduce((a,x)=>a+Number(x.total),0))}</div></div><div class="card kpi"><div class="label">Incomplete sales</div><div class="value">${inc.length}</div></div></div><div class="section"><div><h2>Branch stock</h2><p>Zambezi is the main store.</p></div><button class="btn" onclick="go('Stock')">Manage stock</button></div><div class="branchgrid">${branches.map(b=>`<div class="card"><strong>${esc(b.name)}${b.is_main_store?' · Main store':''}</strong><div class="kpi value">${stocks.filter(s=>s.branch_id===b.id).reduce((n,s)=>n+Number(s.quantity),0)}</div><div class="small">units</div></div>`).join('')}</div><div class="section"><div><h2>Recent incomplete sales</h2></div><button class="btn light" onclick="go('Sales')">View sales</button></div>${salesTable(inc.slice(0,8))}`}
const GAS_SIZES=['1kg','3kg','6kg','13kg','15kg','22.5kg','25kg','45kg','50kg'];
function gasSize(p){const text=`${p.model||''} ${p.name||''}`.toLowerCase().replace(/,/g,'.');for(const size of GAS_SIZES){const n=size.replace('kg','').replace('.','\\.');if(new RegExp(`(^|[^0-9])${n}\\s*(kg)?([^0-9]|$)`,'i').test(text))return size}return 'Other size'}
function stockAlert(p,bid){const current=qtyAt(p.id,bid),base=Number(stocks.find(x=>x.product_id===p.id&&x.branch_id===bid)?.warning_target_quantity||0);if(current===0)return{cls:'bad',label:'OUT OF STOCK'};if(base>0){const declined=(base-current)/base;if(declined>=.75)return{cls:'stock-orange',label:'LOW · 75%+'};if(declined>=.5)return{cls:'warn',label:'LOW · 50%+'}}return{cls:'good',label:'IN STOCK'}}
// Stock ledger: show full + empty = total units for each product at a branch.
function stockTable(rows,bid,isGas,admin){
  if(!rows.length)return '<div class="empty">No products match this branch and category yet.</div>';
  const totals=rows.reduce((a,p)=>{a.full+=qtyAt(p.id,bid);a.empty+=isGas?emptyAt(p.id,bid):0;return a},{full:0,empty:0});
  return `<div class="card tablewrap"><table class="table stock-table"><thead><tr><th>Brand / product</th><th>Code</th><th>Full</th><th>Empty</th><th>Total units</th><th>Stock status</th>${admin?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(p=>{const full=qtyAt(p.id,bid),empty=isGas?emptyAt(p.id,bid):0,a=stockAlert(p,bid);return `<tr><td><b>${esc(p.name)}</b><div class="small">${esc(p.model)}</div></td><td class="code">${esc(p.code)}</td><td>${full}</td><td>${empty}</td><td class="stock-total">${full+empty}</td><td><span class="badge ${a.cls}">${a.label}</span></td>${admin?`<td><div class="inline"><button class="btn light sm" onclick="stockForm('${p.id}','${bid}')">Edit counts</button><button class="btn light sm" onclick="editProductForm('${p.id}')">Edit product</button></div></td>`:''}</tr>`}).join('')}</tbody><tfoot><tr><td colspan="2">BRANCH TOTAL</td><td>${totals.full}</td><td>${totals.empty}</td><td class="stock-total">${totals.full+totals.empty}</td><td colspan="${admin?2:1}"></td></tr></tfoot></table></div>`;
}

function stockPage(){
  // Admins can select every branch; sales representatives see only their assigned branch.
  const branchList=profile.role==='Sales Representative'?branches.filter(b=>b.id===profile.branch_id):branches;
  if(!branchList.some(b=>b.id===stockBranchId))stockBranchId=profile.role==='Sales Representative'?profile.branch_id:'';
  const branch=branchById(stockBranchId),admin=profile.role==='Admin';
  const branchButtons=branchList.map(b=>`<button class="btn ${stockBranchId===b.id?'':'light'}" onclick="stockBranchId='${b.id}';stockGasSize=null;render()">${esc(b.name)}${b.is_main_store?' · Main store':''}</button>`).join('');
  const gas=products.filter(p=>normCategory(p.category)==='gas'&&p.active!==false);
  const gasSizes=[...GAS_SIZES,'Other size'];
  const gasRows=stockGasSize?gas.filter(p=>gasSize(p)===stockGasSize):[];
  return `<div class="section"><div><h2>Stock by branch</h2><p>${admin?'Choose a branch and cylinder size. Total units include full and empty cylinders.':'Read-only stock for your assigned branch.'}</p></div>${admin?`<div class="inline"><button class="btn light" onclick="printProductForm()">Print codes</button><button class="btn light" onclick="adjustCountForm()">Set branch count</button><button class="btn light" onclick="transferForm()">Transfer from Zambezi</button><button class="btn" onclick="addProductForm()">＋ Add product / stock</button></div>`:''}</div>
  <div class="card"><b>1 · Choose branch</b><div class="inline" style="margin-top:10px">${branchButtons||'<span class="muted">No branches available.</span>'}</div></div>
  ${branch?`<div class="card"><div class="between"><div><b>${esc(branch.name)}</b><div class="small">${admin?'Admin can edit counts for every branch.':'Stock view only · contact your Admin to correct counts.'}</div></div>${admin?`<button class="btn light sm" onclick="scan('admin')">Scan product</button>`:''}</div></div>
  <section class="category"><h3>Gas cylinders</h3><div class="card"><b>2 · Choose cylinder size</b><div class="inline" style="margin-top:10px">${gasSizes.map(sz=>`<button class="btn ${stockGasSize===sz?'':'light'}" onclick="stockGasSize='${sz}';render()">${sz}</button>`).join('')}</div></div>
  ${stockGasSize?`<div class="section"><div><h3>${esc(branch.name)} · ${esc(stockGasSize)}</h3><p>Each brand row shows Full + Empty = Total units.</p></div></div>${stockTable(gasRows,branch.id,true,admin)}`:''}</section>
  ${['Accessories','Electricals'].map(cat=>{const rows=products.filter(p=>normCategory(p.category)===normCategory(cat)&&p.active!==false);return `<section class="category"><h3>${cat}</h3>${stockTable(rows,branch.id,false,admin)}</section>`}).join('')}
  <div class="inline" style="margin:14px 0"><span class="badge good">In stock</span><span class="badge warn">Yellow: declined 50% or more</span><span class="badge stock-orange">Orange: declined 75% or more</span><span class="badge bad">Red: out of stock</span></div>`:'<div class="empty">Choose a branch above to see its stock.</div>'}`;
}

function salesTable(rows){
  if(!rows.length)return '<div class="empty">No sales found.</div>';
  return `<div class="card tablewrap"><table class="table"><thead><tr><th>Sale / date</th><th>Customer / destination</th><th>Branch / rep</th><th>Delivery assistant</th><th>Type / product</th><th>Total</th><th>Payment</th><th>Cylinder</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(s=>{
    const canConfirmPickup=profile.role==='Sales Representative'&&s.created_by===sessionUser.id&&s.rider_id===null;
    const canConfirmReturn=profile.role==='Admin'||canConfirmPickup;
    const canEdit=profile.role==='Admin'||(profile.role==='Sales Representative'&&s.created_by===sessionUser.id&&!isDateLocked(s.sale_date));
    const protectedCompleteRefill=profile.role==='Sales Representative'&&s.kind==='Gas refill'&&s.paid&&s.empty_returned;
    return `<tr><td>${esc(s.sale_number||s.id.slice(0,8))}<div class="small">${esc(s.sale_date)}</div></td><td>${esc(s.customer_name)}<div class="small">${esc(s.customer_phone)}</div>${s.customer_destination?`<div class="small">Destination: ${esc(s.customer_destination)}</div>`:''}</td><td>${esc(branchName(s.branch_id))}<div class="small">${esc(staffById(s.created_by)?.full_name||'')} · ${esc(staffById(s.created_by)?.login_id||'')}</div></td><td>${s.rider_id?`${esc(staffById(s.rider_id)?.full_name||'')}<div class="small">${esc(staffById(s.rider_id)?.login_id||'')}</div>`:(s.kind==='Gas refill'?'Customer pick-up':'—')}</td><td>${esc(s.kind)}<div class="small">${esc(s.product_code)} · ${esc(s.product_name)} ${esc(s.product_model)} × ${s.quantity}</div></td><td>${money(s.total)}</td><td>${s.paid?'Paid · '+esc(s.payment_method||''):'Not paid'}</td><td>${s.kind==='Gas refill'?(s.empty_returned?`Returned · ${esc(staffById(s.returned_by)?.full_name||'staff')}<div class="small">${s.rider_id?'Delivery assistant':'Confirmed by Sales Rep / Admin'}</div>`:'Not returned'):'Not required'}</td><td>${badge(s)}</td><td>${!s.cancelled_at&&!s.paid&&canEdit?`<button class="btn light sm" onclick="paymentForm('${s.id}')">Record payment</button>`:''}${!s.cancelled_at&&s.kind==='Gas refill'&&!s.empty_returned&&canConfirmReturn?`<button class="btn light sm" onclick="confirmReturn('${s.id}')">Confirm returned</button>`:''}${!s.cancelled_at&&canEdit&&!protectedCompleteRefill?`<button class="btn danger sm" onclick="cancelSale('${s.id}')">Cancel sale</button>`:''}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

async function downloadBranchMonth(){try{if(profile.role!=='Admin')throw new Error('Only an Admin can download branch reports.');const branchId=$('reportBranch').value,month=$('reportMonth').value,branch=branchById(branchId);if(!branch||!/^\d{4}-\d{2}$/.test(month))throw new Error('Choose a branch and month.');const [year,mon]=month.split('-').map(Number),start=`${month}-01`,end=new Date(Date.UTC(year,mon,1)).toISOString().slice(0,10);let rows=[],offset=0;while(true){const r=await db.from('sales').select('*').eq('tenant_id',profile.tenant_id).eq('branch_id',branchId).gte('sale_date',start).lt('sale_date',end).order('sale_date').range(offset,offset+999);if(r.error)throw r.error;rows.push(...(r.data||[]));if((r.data||[]).length<1000)break;offset+=1000}if(!rows.length)throw new Error(`No sales were found for ${branch.name} in ${month}.`);const tag=branch.name.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');const saleCols=['sale_number','sale_date','customer_name','customer_phone','customer_destination','product_code','product_name','product_model','kind','quantity','unit_price','total','paid','payment_method','payment_reference','empty_returned','cancelled_at'];saveCsv(`Baraka-${tag}-sales-${month}.csv`,saleCols,rows.map(s=>saleCols.map(k=>s[k])));const byPhone=new Map();for(const s of rows){const key=String(s.customer_phone||'').replace(/\D/g,'');if(!key)continue;const c=byPhone.get(key)||{name:s.customer_name,phone:s.customer_phone,first:s.sale_date,last:s.sale_date,count:0};c.first=String(s.sale_date)<String(c.first)?s.sale_date:c.first;c.last=String(s.sale_date)>String(c.last)?s.sale_date:c.last;c.count++;byPhone.set(key,c)}saveCsv(`Baraka-${tag}-customers-${month}.csv`,['customer_name','telephone','first_sale_in_month','last_sale_in_month','sales_count'],[...byPhone.values()].map(c=>[c.name,c.phone,c.first,c.last,c.count]));closeModal();toast('Monthly branch sales and customer files downloaded')}catch(e){fail(e)}}

function saveAdjustCount(){const pid=$('adjustProduct')?.value,bid=$('adjustBranch')?.value;if(!pid||!bid){toast('Choose a product and branch.');return}saveStockCount(pid,bid)}function stockForm(pid,bid){if(profile.role!=='Admin'){toast('Only an Admin can edit stock.');return}const p=productById(pid),gas=normCategory(p?.category)==='gas';modal(`<h2>Edit branch stock</h2><p><b>${esc(p.name)} · ${esc(p.model)}</b><br><span class="code">${esc(p.code)}</span><br>${esc(branchName(bid))}</p><div class="field"><label>FULL UNITS ON HAND</label><input id="stockCount" type="number" min="0" value="${qtyAt(pid,bid)}"></div>${gas?`<div class="field"><label>EMPTY CYLINDERS PHYSICALLY AT THIS BRANCH</label><input id="emptyCount" type="number" min="0" value="${emptyAt(pid,bid)}"></div>`:''}<p class="small">Saving this physical count resets the low-stock warning reference to the full count entered.</p><button class="btn" onclick="saveStockCount('${pid}','${bid}')">Save counts</button>`)}
async function saveStockCount(pid,bid){try{if(profile.role!=='Admin')throw new Error('Only an Admin can edit stock.');const quantity=Number($('stockCount').value),p=productById(pid),row=stocks.find(x=>x.product_id===pid&&x.branch_id===bid),empty=$('emptyCount')?Number($('emptyCount').value):Number(row?.empty_quantity||0);if(!Number.isInteger(quantity)||quantity<0||!Number.isInteger(empty)||empty<0)throw new Error('Enter whole quantities of zero or more.');const r=await db.from('branch_stock').upsert({tenant_id:profile.tenant_id,branch_id:bid,product_id:pid,quantity,warning_target_quantity:quantity,empty_quantity:empty,updated_at:new Date().toISOString()},{onConflict:'tenant_id,branch_id,product_id'});if(r.error)throw r.error;closeModal();await refresh();toast('Branch stock updated')}catch(e){fail(e)}}
function editProductForm(pid){const p=productById(pid);modal(`<h2>Edit product</h2><div class="field"><label>PRODUCT NAME</label><input id="editName" value="${esc(p.name)}"></div><div class="field"><label>MODEL / SIZE / NUMBER</label><input id="editModel" value="${esc(p.model)}"></div><div class="field"><label>CATEGORY</label><select id="editCategory">${cats.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select></div><div class="field"><label>STANDARD SELLING PRICE</label><input id="editPrice" type="number" min="0" value="${p.price}"></div><p class="small">The original barcode code stays attached to this product so printed labels continue to work.</p><button class="btn" onclick="saveProductEdit('${pid}')">Save changes</button>`)}
async function saveProductEdit(pid){try{const values={name:$('editName').value.trim(),model:$('editModel').value.trim(),category:$('editCategory').value,price:Number($('editPrice').value)};if(!values.name||!values.model||!Number.isFinite(values.price)||values.price<0)throw new Error('Check the name, model and price.');const r=await db.from('products').update(values).eq('id',pid).eq('tenant_id',profile.tenant_id);if(r.error)throw r.error;closeModal();await refresh();toast('Product updated')}catch(e){fail(e)}}
async function toggleProduct(pid,active){try{const r=await db.from('products').update({active}).eq('id',pid).eq('tenant_id',profile.tenant_id);if(r.error)throw r.error;await refresh();toast(active?'Product restored':'Product removed from new sales')}catch(e){fail(e)}}
function transferForm(){const z=branches.find(b=>b.is_main_store);if(!z){toast('Main store is not set in the branch list');return}if(!products.length){toast('No products are loaded for this business yet.');return}if(!branches.some(b=>b.id!==z.id)){toast('Add another branch before transferring stock.');return}modal(`<h2>Transfer stock from ${esc(z.name)}</h2><div class="field"><label>PRODUCT</label><select id="transferProduct" onchange="updateTransferEmpty()"><option value="">Choose a product</option>${products.map(p=>`<option value="${p.id}">${esc(p.code)} · ${esc(p.name)} · ${qtyAt(p.id,z.id)} full at main store</option>`).join('')}</select></div><div class="field"><label>TO BRANCH</label><select id="transferTo" onchange="updateTransferEmpty()">${branches.filter(b=>b.id!==z.id).map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>FULL CYLINDERS TO SEND</label><input id="transferQty" type="number" min="1"></div><div id="emptyTransferInfo" class="notice">Choose a product to see Zambezi's available count.</div><div class="field" id="emptyTransferField"><label>EMPTY CYLINDERS TO BRING BACK</label><input id="emptyTransferQty" type="number" min="0" value="0"></div><button class="btn" onclick="saveTransfer()">Record transfer</button>`);updateTransferEmpty()}
function updateTransferEmpty(){const pid=$('transferProduct')?.value,p=productById(pid),to=$('transferTo')?.value,z=branches.find(b=>b.is_main_store),field=$('emptyTransferField'),info=$('emptyTransferInfo');if(!field||!info)return;if(!p){field.classList.add('hidden');info.textContent='Choose a product to see Zambezi\'s available count.';return}const available=qtyAt(p.id,z?.id),gas=normCategory(p.category)==='gas';field.classList.toggle('hidden',!gas);info.textContent=`Zambezi has ${available} full unit(s) of this product. ${gas?`${branchName(to)} has ${emptyAt(p.id,to)} confirmed empty cylinder(s); enter how many you are physically bringing back.`:'Empty-cylinder collection applies to Gas products only.'}`;if($('transferQty'))$('transferQty').max=String(available);if($('emptyTransferQty'))$('emptyTransferQty').max=String(emptyAt(p.id,to))}
async function saveTransfer(){try{const pid=$('transferProduct')?.value,to=$('transferTo')?.value,qty=Number($('transferQty')?.value),z=branches.find(b=>b.is_main_store),p=productById(pid),empties=normCategory(p?.category)==='gas'?Number($('emptyTransferQty').value||0):0;if(!pid||!to||!Number.isInteger(qty)||qty<1||!Number.isInteger(empties)||empties<0)throw new Error('Choose a product, destination and valid whole quantities.');if(!z)throw new Error('Main store is not set in the branch list.');if(qty>qtyAt(pid,z.id))throw new Error(`Zambezi has only ${qtyAt(pid,z.id)} full unit(s) of this product available to transfer.`);if(empties>emptyAt(pid,to))throw new Error('The branch has fewer confirmed empties than that.');const r=await db.rpc('transfer_branch_stock',{p_product_id:pid,p_from_branch_id:z.id,p_to_branch_id:to,p_quantity:qty,p_empty_cylinders:empties});if(r.error)throw r.error;closeModal();await refresh();toast(`Transfer recorded to ${branchName(to)} · ${empties} empty cylinders returned`)}catch(e){fail(e)}}
function toggleDestinationField(){const hasName=!!$("customerName")?.value.trim(),field=$("destinationField");if(field)field.classList.toggle("hidden",hasName);if(hasName&&$("customerDestination"))$("customerDestination").value=""}
// Only customer-pickup Gas refills can record a return during sale entry.
function toggleSaleOptions(){const refill=$("kind")?.value==='Gas refill';$("riderField")?.classList.toggle('hidden',!refill);togglePickupReturnField()}
function togglePickupReturnField(){const show=$("kind")?.value==='Gas refill'&&$("rider")?.value==='pickup';$("pickupReturnField")?.classList.toggle('hidden',!show);if(!show&&$("pickupReturned"))$("pickupReturned").value='no'}
// A sale must identify a person or a destination; the server repeats this validation.
async function recordSale(){
  const button=$('recordSaleBtn');
  let saleSaved=false;
  try{
    if(closures.some(x=>x.business_date===today())||submissions.some(x=>x.user_id===sessionUser.id&&x.business_date===today()))throw new Error('Today is locked. Ask the Admin to reopen it before recording or correcting sales.');
    if(button){button.disabled=true;button.textContent='Recording…'}
    const pid=$('saleProduct').value,p=productById(pid),qty=Number($('saleQty').value);
    const name=$('customerName').value.trim(),destination=$('customerDestination').value.trim();
    const phone=$('customerPhone').value.trim(),kind=$('kind').value,paid=$('paid').value==='yes';
    const deliveryOption=$('rider').value,rider=kind==='Gas refill'&&deliveryOption!=='pickup'?deliveryOption:'';
    const pickupReturned=kind==='Gas refill'&&deliveryOption==='pickup'&&$('pickupReturned').value==='yes';
    if(!p||!Number.isInteger(qty)||qty<1||(!name&&!destination)||!phone)
      throw new Error('Enter a product, whole quantity, customer name or destination, and telephone.');
    if(qty>qtyAt(p.id,profile.branch_id))throw new Error('There is not enough stock at your branch.');
    if(kind==='Gas refill'&&!deliveryOption)throw new Error('Choose a delivery assistant or Customer pick-up for this refill.');
    const r=await db.rpc('record_sale_with_pickup_return',{p_branch_id:profile.branch_id,p_product_id:p.id,p_kind:kind,
      p_quantity:qty,p_customer_name:name||null,p_customer_phone:phone,p_paid:paid,
      p_payment_method:paid?$('payMethod').value:null,
      p_payment_reference:paid?$('payRef').value.trim()||null:null,
      p_rider_id:rider||null,p_customer_destination:destination||null,p_empty_returned:pickupReturned});
    if(r.error)throw r.error;
    saleSaved=true;
    await refresh();toast('Sale recorded · '+String(r.data).slice(0,8));go('New sale');
  }catch(e){fail(e);if(button){button.disabled=saleSaved;button.textContent=saleSaved?'Sale saved · reload':'Record sale'}if(saleSaved)toast('Sale was saved. Reload the page to confirm the latest records.')}
}

function paymentForm(id){modal(`<h2>Record payment received</h2><p>Only confirm after you have received the customer’s payment.</p><div class="field"><label>PAYMENT METHOD</label><select id="paymentMethod"><option>Cash</option><option>M-Pesa</option><option>Other</option></select></div><div class="field"><label>REFERENCE (OPTIONAL)</label><input id="paymentRef"></div><button class="btn" onclick="savePayment('${id}')">Confirm payment</button>`)}
async function savePayment(id){try{const r=await db.rpc('record_payment',{p_sale_id:id,p_payment_method:$('paymentMethod').value,p_payment_reference:$('paymentRef').value.trim()||null});if(r.error)throw r.error;closeModal();await refresh();toast('Payment recorded')}catch(e){fail(e)}}
async function cancelSale(id){if(!confirm('Cancel this sale and restore its stock? The cancellation will remain in the records. If payment was collected, handle any refund separately.'))return;try{const r=await db.rpc('cancel_sale',{p_sale_id:id});if(r.error)throw r.error;await refresh();toast('Sale cancelled and stock restored')}catch(e){fail(e)}}
async function confirmReturn(id){if(!confirm('Confirm that the empty cylinder has physically returned?'))return;try{const r=await db.rpc('confirm_empty_return',{p_sale_id:id});if(r.error)throw r.error;await refresh();toast('Cylinder return recorded')}catch(e){fail(e)}}
async function returnCylinder(id){if(!confirm('Confirm that this empty cylinder has physically returned?'))return;try{const r=await db.rpc('confirm_empty_return',{p_sale_id:id});if(r.error)throw r.error;await refresh();toast('Cylinder return recorded')}catch(e){fail(e)}}
async function submitToday(){try{const r=await db.rpc('submit_sales_day',{p_business_date:today()});if(r.error)throw r.error;await refresh();modal(`<h2>Thank you, ${esc(profile.full_name)}!</h2><div class="welcome">Every honest sale moves Baraka forward. Thank you for your effort—tomorrow is another chance to shine.</div><button class="btn" onclick="closeModal()">Continue</button>`)}catch(e){fail(e)}}
async function closeDay(d){if(!confirm(`Close ${d}? Sales reps will not be able to submit more sales for that date.`))return;try{const r=await db.rpc('close_business_day',{p_business_date:d});if(r.error)throw r.error;await refresh();modal(`<h2>Day closed · well done</h2><div class="welcome">Today’s records are in order. Each day you close builds a stronger Baraka—tomorrow is a fresh opportunity to grow.</div><button class="btn" onclick="closeModal()">Continue</button>`)}catch(e){fail(e)}}
// Admin reopening removes the date lock and records an audit entry in Supabase.
async function reopenDay(d){if(profile.role!=='Admin'){toast('Only an Admin can reopen a business date.');return}if(!confirm(`Reopen ${d} for staff corrections? Sales Representatives can then correct eligible sales and submit that date again.`))return;try{const r=await db.rpc('reopen_business_day',{p_business_date:d,p_reason:'Admin reopened for staff correction'});if(r.error)throw r.error;await refresh();modal(`<h2>Date reopened</h2><div class="notice">${esc(d)} is unlocked. Staff may correct eligible sales and submit the date again. ${Number(r.data?.submissions_unlocked||0)} staff submission(s) were unlocked.</div><button class="btn" onclick="closeModal()">Done</button>`)}catch(e){fail(e)}}
function isDateLocked(d){return submissions.some(x=>x.user_id===sessionUser.id&&x.business_date===d)||closures.some(x=>x.business_date===d)}
function staffForm(){modal(`<h2>Register staff</h2><div class="field"><label>FULL NAME</label><input id="staffName"></div><div class="field"><label>ROLE</label><select id="staffRole" onchange="staffBranchToggle()"><option>Sales Representative</option><option>Delivery Assistant</option></select></div><div class="field"><label>ASSIGNED BRANCH</label><select id="staffBranch">${branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>LOGIN ID</label><input id="staffLogin" placeholder="e.g. NDERI-SALES-01"></div><div class="field"><label>TEMPORARY PASSWORD</label><input id="staffPass" type="password" autocomplete="new-password"></div><div class="small">At least 8 characters, one capital letter and one special character.</div><button class="btn" style="margin-top:12px" onclick="createStaff()">Create login</button>`)}
function staffBranchToggle(){$('staffBranch').disabled=false}
async function edgeFunctionErrorMessage(error){const response=error?.context;if(response&&typeof response.clone==='function'){try{const body=await response.clone().json();if(body?.error||body?.message)return String(body.error||body.message)}catch{}try{const body=(await response.clone().text()).trim();if(body)return body}catch{}}return error?.message||'Could not reach the account service.'}
async function createStaff(){try{const role=$('staffRole').value,password=$('staffPass').value,loginId=$('staffLogin').value.trim().toUpperCase(),fullName=$('staffName').value.trim(),branchId=$('staffBranch').value;if(password.length<8||!/[A-Z]/.test(password)||!/[^A-Za-z0-9]/.test(password))throw new Error('Password must be 8+ characters with one capital and one special character.');const {data,error}=await db.functions.invoke('manage-accounts',{body:{action:'create-staff',role,branchId,loginId,fullName,password}});if(error)throw new Error(await edgeFunctionErrorMessage(error));if(!data?.ok)throw new Error(data?.error||'Could not create the staff login.');closeModal();await refresh();modal(`<h2>Staff login created</h2><div class="notice">Login ID: <b>${esc(loginId)}</b><br>Password: <b>${esc(password)}</b><br>Role: ${esc(role)} · ${esc(branchName(branchId))}</div><p class="small">Give these details privately to the staff member.</p><button class="btn" onclick="closeModal()">Done</button>`);toast('Staff login created')}catch(e){fail(e)}}
function clientForm(){modal(`<h2>Register a client business</h2><div class="field"><label>BUSINESS NAME</label><input id="clientName"></div><div class="field"><label>ADMIN FULL NAME</label><input id="clientAdminName"></div><div class="field"><label>ADMIN LOGIN ID</label><input id="clientLogin"></div><div class="field"><label>ADMIN PASSWORD</label><input id="clientPass" type="password" autocomplete="new-password"></div><div class="field"><label>BRANCH NAMES · ONE PER LINE</label><textarea id="clientBranches" rows="5" placeholder="Main store\nSecond branch"></textarea></div><div class="small">The first branch entered will be marked as the main store. Password needs 8+ characters, a capital letter and a special character.</div><button class="btn" style="margin-top:12px" onclick="createClient()">Create business Admin</button>`)}
async function createClient(){try{const businessName=$('clientName').value.trim(),fullName=$('clientAdminName').value.trim(),loginId=$('clientLogin').value.trim().toUpperCase(),password=$('clientPass').value,branchNames=$('clientBranches').value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(password.length<8||!/[A-Z]/.test(password)||!/[^A-Za-z0-9]/.test(password))throw new Error('Password must be 8+ characters with one capital and one special character.');const {data,error}=await db.functions.invoke('manage-accounts',{body:{action:'create-client-admin',businessName,fullName,loginId,password,branches:branchNames}});if(error||!data?.ok)throw new Error(data?.error||error?.message||'Could not create the business.');closeModal();await refresh();toast('Business Admin created · '+loginId)}catch(e){fail(e)}}
async function changeAccess(targetLoginId,active){if(!confirm(`${active?'Restore':'Deactivate'} access for ${targetLoginId}?`))return;try{const {data,error}=await db.functions.invoke('manage-accounts',{body:{action:'set-account-active',targetLoginId,active}});if(error||!data?.ok)throw new Error(data?.error||error?.message||'Could not change access.');await refresh();toast(`${targetLoginId} · ${active?'active':'deactivated'}`)}catch(e){fail(e)}}
function resetPasswordForm(targetLoginId){modal(`<h2>Reset password</h2><p>Set a new password for <b>${esc(targetLoginId)}</b>.</p><div class="field"><label>NEW PASSWORD</label><input id="resetPass" type="password" autocomplete="new-password"></div><div class="small">At least 8 characters, one capital letter and one special character.</div><button class="btn" style="margin-top:12px" onclick="resetPassword('${esc(targetLoginId)}')">Save password</button>`)}
async function resetPassword(targetLoginId){try{const password=$('resetPass').value;if(password.length<8||!/[A-Z]/.test(password)||!/[^A-Za-z0-9]/.test(password))throw new Error('Password needs 8+ characters, one capital and one special character.');const {data,error}=await db.functions.invoke('manage-accounts',{body:{action:'reset-account-password',targetLoginId,password}});if(error||!data?.ok)throw new Error(data?.error||error?.message||'Could not reset password.');closeModal();modal(`<h2>Password reset</h2><div class="notice">New password for <b>${esc(targetLoginId)}</b>:<br><b>${esc(password)}</b></div><p class="small">Share it privately with the staff member. They can sign in with this new password.</p><button class="btn" onclick="closeModal()">Done</button>`)}catch(e){fail(e)}}
function printProductForm(){if(!products.length){toast('No products loaded to print yet.');return}modal(`<h2>Print product codes</h2><div class="field"><label>PRODUCT</label><select id="printProduct">${products.map(p=>`<option value="${p.id}">${esc(p.code)} · ${esc(p.name)} · ${esc(p.model)}</option>`).join('')}</select></div><button class="btn" onclick="printSelectedLabels()">Choose label quantity</button>`)}
function printSelectedLabels(){const pid=$('printProduct')?.value;closeModal();if(pid)printLabels(pid)}function printLabels(pid){const p=productById(pid);const qty=Number(prompt('How many labels? Enter a number from 1 to 100.', '1'));if(!Number.isInteger(qty)||qty<1||qty>100)return;const area=$('printArea');area.innerHTML=`<div class="label-sheet">${Array.from({length:qty},(_,i)=>`<div class="product-label"><b>${esc(p.name)}</b><div>${esc(p.model)}</div><svg class="bc" data-code="${esc(p.code)}"></svg></div>`).join('')}</div>`;area.classList.remove('hidden');if(window.JsBarcode)document.querySelectorAll('#printArea .bc').forEach(svg=>window.JsBarcode(svg,svg.dataset.code,{format:'CODE128',width:1.5,height:40,displayValue:true,fontSize:10,margin:2}));else toast('Barcode library not available; print the code manually.');window.print();area.classList.add('hidden')}
async function scan(target){if(!navigator.mediaDevices?.getUserMedia){toast('Camera scanning needs an HTTPS link and camera permission.');return}modal(`<h2>Scan Baraka product code</h2><p>Point the camera at a printed product label.</p><video id="video" autoplay playsinline></video><button class="btn light" onclick="stopScan()">Cancel</button>`);try{const video=$('video');if(window.ZXingBrowser?.BrowserMultiFormatReader){const reader=new ZXingBrowser.BrowserMultiFormatReader();let found=false;const controls=await reader.decodeFromVideoDevice(undefined,video,result=>{if(result&&!found){found=true;const raw=result.getText();if(window.scanControls)stopScan();else closeModal();{const p=products.find(x=>x.code===raw);if(p)chooseStockBranch(p.id);else toast('No matching product')}}});window.scanControls=controls;if(found||!$('video')){controls.stop();window.scanControls=null}return}if(!('BarcodeDetector'in window))throw new Error('Barcode scanning is not supported in this browser.');const formats=await BarcodeDetector.getSupportedFormats(),detector=new BarcodeDetector({formats}),stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});window.scanStream=stream;video.srcObject=stream;await video.play();const loop=async()=>{if(!window.scanStream||!$('video'))return;try{const codes=await detector.detect(video);if(codes.length){const raw=codes[0].rawValue;stopScan();{const p=products.find(x=>x.code===raw);if(p)chooseStockBranch(p.id);else toast('No matching product')}return}}catch{}setTimeout(loop,220)};loop()}catch(e){stopScan();toast(e.message||'Could not open the camera. Type the product code instead.')}}
function chooseStockBranch(pid){modal(`<h2>Choose branch stock</h2><p>${esc(productById(pid)?.name||'Product')} · ${esc(productById(pid)?.code||'')}</p><div class="field"><label>BRANCH</label><select id="scanBranch">${branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><button class="btn" onclick="const b=$('scanBranch').value;closeModal();stockForm('${pid}',b)">Edit stock</button>`)}
function stopScan(){if(window.scanStream){window.scanStream.getTracks().forEach(x=>x.stop());window.scanStream=null}if(window.scanControls){try{window.scanControls.stop()}catch{}window.scanControls=null}closeModal()}
function modal(html){$('modal').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`}
function closeModal(){if(window.scanStream){window.scanStream.getTracks().forEach(x=>x.stop());window.scanStream=null}if(window.scanControls){try{window.scanControls.stop()}catch{}window.scanControls=null}$('modal').replaceChildren()}
// Refresh the branch data and unlock state at Kenya midnight without requiring a new login.
let refreshingBusinessDate=false;
setInterval(async()=>{const current=today();if(current===lastBusinessDate||refreshingBusinessDate)return;if(!sessionUser){lastBusinessDate=current;return}refreshingBusinessDate=true;try{await refresh();lastBusinessDate=current}catch(e){console.error('Could not refresh Baraka for the new business date.',e)}finally{refreshingBusinessDate=false}},30000);
$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('loginId').addEventListener('keydown',e=>{if(e.key==='Enter')$('password').focus()});
