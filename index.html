<style>

ted);font-size:13px}.grid2,.grid3,.branchgrid{display:grid;gap:12px}.grid2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.branchgrid{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}.kpi .label{font-size:12px;color:var(--muted)}.kpi .value{font-size:26px;font-weight:900}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top}.table th{font-size:11px;color:var(--muted);text-transform:uppercase}.badge{display:inline-block;padding:4px 8px;border-radius:30px;background:#eef2ec;font-size:11px;font-weight:800}.good{background:#e4f2e6;color:#24603d}.warn{background:#fff3d5;color:#785900}.bad{background:#f8e9e6;color:#9b3022}.stock-orange{background:#ffe3ca;color:#93410b}.notice{background:#fbf6d9;border:1px solid #eadf9c;border-radius:11px;padding:11px;color:#5f5417;font-size:13px}.empty{padding:20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.code{font-family:ui-monospace,Consolas,monospace;font-weight:800}.hidden{display:none!important}.status{min-height:22px;font-weight:750;margin-top:8px}.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:14px;z-index:10}.modal{background:#fff;border-radius:16px;padding:20px;width:min(560px,100%);max-height:90vh;overflow:auto}.welcome{background:linear-gradient(110deg,#eff5e9,#f7f9e6);border-left:5px solid var(--lime);border-radius:12px;padding:12px 16px;margin:8px 0 16px;color:var(--ink);font-weight:650}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#20382f;color:#fff;padding:11px 16px;border-radius:30px;z-index:20;box-shadow:0 5px 20px #0003}.label-sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.product-label{border:1px dashed #777;padding:10px;text-align:center;break-inside:avoid}.product-label svg{max-width:100%}video{width:100%;max-height:55vh;background:#111;border-radius:10px}.category{margin-top:20px}.category h3{background:#eaf0e7;border-left:4px solid var(--lime);padding:8px 11px;border-radius:8px}.phone-input{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:0 10px}.phone-input input{border:0!important;outline:none;min-width:0}.phone-input .prefix{font-weight:850;white-space:nowrap;color:var(--g)}.phone-input .flag{font-size:20px}.loading-view{padding:32px;text-align:center;color:var(--muted)}.searchrow{display:flex;gap:8px;flex-wrap:wrap}.searchrow>*{flex:1;min-width:170px}.stock-table th,.stock-table td{text-align:right}.stock-table th:first-child,.stock-table td:first-child{text-align:left}.stock-table tfoot{font-weight:900;background:#f3f6f1}.stock-total{font-size:18px;font-weight:900;color:var(--g)}@media(max-width:650px){.wrap{padding:14px 10px}.grid2,.grid3{grid-template-columns:1fr}.top{padding:12px}.table{min-width:820px}.tabs{overflow-x:auto;flex-wrap:nowrap}.tab{white-space:nowrap}.label-sheet{grid-template-columns:repeat(2,1fr)}}@media print{body{background:#fff}.top,.wrap>*:not(#printArea),#app,.modalback,.toast{display:none!important}#printArea{display:block!important}.product-label{border:1px dashed #555}}

<body>
<header class="top"><div><div class="brand">BARAKA · STOCK & SALES</div><small id="topSub">Secure branch records</small></div><div class="inline"><span id="userBadge" class="small"></span><button id="logout" class="btn light hidden" onclick="logout()">Sign out</button></div></header>
<main class="wrap">
<section id="loginCard" class="card login"><h1 style="margin:0">Sign in to Baraka</h1><p class="muted">Use the login ID and password given to you by your Admin.</p><div class="field"><label>LOGIN ID</label><input id="loginId" name="baraka-login-entry" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false"></div><div class="field"><label>PASSWORD</label><input id="password" name="baraka-password-entry" type="password" autocomplete="off"></div><button id="loginBtn" class="btn" style="width:100%" onclick="login()">Sign in</button><div id="loginStatus" class="status"></div><div class="notice" style="margin-top:14px">Use only the official Baraka link. Never share your password or Supabase service key.</div></section>
<section id="app" class="hidden"><div class="section"><div><h1 id="welcome" style="margin:0">Baraka</h1><p id="identity" class="muted" style="margin:3px 0"></p></div><span class="badge" id="branchLabel"></span></div><div class="welcome" id="welcomeMessage"></div><div id="appNavigation" class="inline app-navigation"><button id="backButton" class="btn light" onclick="goBack()">← Back to previous panel</button><button id="homeButton" class="btn light sm" onclick="goHome()">Home</button></div><nav class="tabs" id="tabs"></nav><div id="content"></div></section>
</main>
<div id="modal"></div><div id="toastRoot"></div>
<script>
const PROJECT_URL='https://xaxtnvpnbrsevedhbmly.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_0E5DHXzQu9iWbZ2K983lBA_vvutWdgP';
let db=null;try{if(window.supabase?.createClient)db=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storage:window.localStorage}});else console.error('Supabase browser library did not load.')}catch(e){console.error('Supabase client could not start.',e)}
const $=id=>document.getElementById(id), esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=x=>'KES '+Number(x||0).toLocaleString('en-KE');
const cats=['Gas','Accessories','Electricals'];
const normCategory=x=>String(x??'').trim().toLowerCase();
let sessionUser=null, profile=null, tenant=null, branches=[], products=[], stocks=[], staff=[], sales=[], customers=[], submissions=[], closures=[], tenants=[], refillRequests=[], storeRefills=[], borrows=[], borrowBranchOptions=[], borrowStockByKey={}, activeTab='', isSuper=false, stockBranchId='', stockGasSize=null, tabHistory=[], operationsLoaded=false, operationsLoading=false,backGuardArmed=false,pageLoading=false,dailyCloseDate=today(),salesDateFilter='',salesBranchFilter='',salesSearchFilter='';
const say=(id,msg,ok=false)=>{const e=$(id);if(e){e.textContent=msg;e.className='status '+(ok?'good':'bad')}};
if(!db)say('loginStatus',window.__barakaSupabaseLoadFailed?'Sign-in connection did not load. Check internet and reload this page.':'Sign-in connection is unavailable in this page. Open the official Baraka website and reload.');
function toast(s){$('toastRoot').innerHTML=`<div class="toast">${esc(s)}</div>`;setTimeout(()=>$('toastRoot').replaceChildren(),2800)}
function fail(e){console.error(e);toast(e?.message||'Something went wrong. Please try again.')}
// Baraka business dates follow Kenya time, not UTC, so yesterday's submission cannot lock today's sales.
function today(){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Africa/Nairobi',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const v=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${v.year}-${v.month}-${v.day}`}
let lastBusinessDate=today();
const branchById=id=>branches.find(b=>b.id===id)||borrowBranchOptions.find(b=>b.id===id), branchName=id=>branchById(id)?.name||'—', productById=id=>products.find(p=>p.id===id), staffById=id=>staff.find(s=>s.user_id===id);
function qtyAt(pid,bid){return Number(stocks.find(x=>x.product_id===pid&&x.branch_id===bid)?.quantity||0)}
function emptyAt(pid,bid){return Number(stocks.find(x=>x.product_id===pid&&x.branch_id===bid)?.empty_quantity||0)}
function faultyAt(pid,bid){return Number(stocks.find(x=>x.product_id===pid&&x.branch_id===bid)?.faulty_quantity||0)}
function status(s){if(s.cancelled_at)return'Cancelled';if(!s.paid)return'Awaiting payment';if(s.kind==='Gas refill'&&!s.empty_returned)return'Awaiting empty cylinder';return'Complete'}
function badge(s){const x=status(s);return `<span class="badge ${x==='Complete'?'good':x==='Awaiting payment'?'bad':'warn'}">${x}</span>`}
async function login(){const b=$('loginBtn'),loginId=$('loginId').value.trim().toUpperCase(),password=$('password').value;if(!loginId||!password){say('loginStatus','Enter your login ID and password.');return}if(!db){say('loginStatus',window.__barakaSupabaseLoadFailed?'Baraka could not load its sign-in connection. Check internet, then reload the official website.':'Sign-in is not ready in this page. Open the official Baraka website and reload it.');return}b.disabled=true;b.textContent='Checking…';say('loginStatus','Connecting securely to Baraka…',true);try{const {data,error}=await db.functions.invoke('login-by-id',{body:{loginId,password}});if(error){let detail='';try{const body=error.context&&typeof error.context.json==='function'?await error.context.json():null;detail=body?.error||body?.message||''}catch{}throw new Error(detail||error.message||'The sign-in service could not be reached.')}if(!data?.access_token)throw new Error(data?.error||'The sign-in service did not return a login session. Check that the login ID and password are correct.');say('loginStatus','Login accepted. Loading your branch…',true);const {error:se}=await db.auth.setSession({access_token:data.access_token,refresh_token:data.refresh_token});if(se)throw se;const {data:{user},error:ue}=await db.auth.getUser();if(ue||!user)throw new Error('Login was accepted, but Baraka could not confirm the account.');const {data:p,error:pe}=await db.from('profiles').select('*').eq('user_id',user.id).single();if(pe||!p)throw new Error('Login was accepted, but no staff profile was found. Ask the Admin to check this staff account.');profile=p;sessionUser=user;isSuper=p.login_id==='SUPER-ADMIN-001';await loadData();await showApp()}catch(e){if(db?.auth){try{await db.auth.signOut()}catch{}}fail(e);say('loginStatus',e.message||'Login failed.')}finally{b.disabled=false;b.textContent='Sign in'}}
async function restoreSession(){if(!db)return;try{const {data,error}=await db.auth.getSession();if(error)throw error;if(!data?.session)return;const {data:{user},error:userError}=await db.auth.getUser();if(userError||!user)throw userError||new Error('Saved sign-in has expired.');const {data:p,error:profileError}=await db.from('profiles').select('*').eq('user_id',user.id).eq('active',true).single();if(profileError||!p)throw profileError||new Error('This staff account is inactive.');sessionUser=user;profile=p;isSuper=p.login_id==='SUPER-ADMIN-001';await loadData();await showApp()}catch(e){console.warn('Could not restore the saved Baraka session.',e);say('loginStatus','Your saved sign-in could not be restored. Check your internet connection and sign in again.') }}
async function loadData(){
  const t=await db.from('tenants').select('id,name').eq('id',profile.tenant_id).single();if(t.error)throw t.error;tenant=t.data;
  let profilesQuery=db.from('profiles').select('user_id,tenant_id,branch_id,role,login_id,full_name,active');if(!isSuper)profilesQuery=profilesQuery.eq('tenant_id',profile.tenant_id);
  const results=await Promise.all([
    db.from('branches').select('id,tenant_id,name,is_main_store,active').eq('tenant_id',profile.tenant_id).eq('active',true).order('name'),
    db.from('products').select('id,tenant_id,code,name,model,category,price,active').eq('tenant_id',profile.tenant_id),
    db.from('branch_stock').select('tenant_id,branch_id,product_id,quantity,empty_quantity,faulty_quantity,warning_target_quantity').eq('tenant_id',profile.tenant_id),profilesQuery
  ]);
  for(const r of results)if(r.error)throw r.error;
  branches=results[0].data||[];products=(results[1].data||[]).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||''),'en',{sensitivity:'base'})||String(a.model||'').localeCompare(String(b.model||''),'en',{sensitivity:'base'}));
  stocks=results[2].data||[];staff=results[3].data||[];sales=[];customers=[];submissions=[];closures=[];operationsLoaded=false;
  if(isSuper){const tr=await db.from('tenants').select('id,name').order('name');if(!tr.error)tenants=tr.data||[]}
}
async function loadPageData(tab){
  const q=(name)=>db.from(name).select('*').eq('tenant_id',profile.tenant_id);
  const recentSales=async()=>{const from=new Date(today()+'T00:00:00Z');from.setUTCDate(from.getUTCDate()-30);const r=await q('sales').gte('sale_date',from.toISOString().slice(0,10)).order('sale_date',{ascending:false}).limit(500);if(r.error)throw r.error;sales=r.data||[]};
  const dailyStatus=async(date=null,repOnly=false)=>{let sq=q('daily_submissions'),cq=q('daily_closures');if(date){sq=sq.eq('business_date',date);cq=cq.eq('business_date',date)}if(repOnly)sq=sq.eq('user_id',sessionUser.id);const rs=await Promise.all([sq,cq]);for(const r of rs)if(r.error)throw r.error;submissions=rs[0].data||[];closures=rs[1].data||[]};
  if(tab==='Overview'){await recentSales();return}
  if(tab==='Sales'){if(salesDateFilter)await loadSalesForDate(salesDateFilter,salesBranchFilter);else await recentSales();return}
  if(tab==='Customers'){const r=await q('customers').order('created_at',{ascending:false}).limit(500);if(r.error)throw r.error;customers=r.data||[];return}
  if(tab==='Daily close'){await Promise.all([loadSalesForDate(dailyCloseDate),dailyStatus()]);return}
  if(tab==='New sale'){await dailyStatus(today(),true);return}
  if(tab==='My branch sales'){await Promise.all([loadSalesForDate(today(),profile.branch_id),dailyStatus()]);return}
  if(tab==='Submit day'){const [rows]=await Promise.all([loadSalesForDate(today(),profile.branch_id),dailyStatus(today(),true)]);return rows}
  if(tab==='My deliveries'){const r=await q('sales').eq('rider_id',sessionUser.id).order('sale_date',{ascending:false}).limit(500);if(r.error)throw r.error;sales=r.data||[];return}
  if(tab==='Cylinder operations'){if(!operationsLoaded)await loadCylinderData();return}
}
async function readAllOperationsRows(table,sortColumn){let rows=[],offset=0;while(true){const result=await db.from(table).select('*').eq('tenant_id',profile.tenant_id).order(sortColumn,{ascending:false}).order('id',{ascending:false}).range(offset,offset+999);if(result.error)throw result.error;const page=result.data||[];rows.push(...page);if(page.length<1000)break;offset+=1000}return rows}
async function loadCylinderData(){const results=await Promise.all([readAllOperationsRows('branch_refill_requests','business_date'),readAllOperationsRows('store_refill_batches','created_at'),readAllOperationsRows('stock_borrows','created_at')]);refillRequests=results[0];storeRefills=results[1];borrows=results[2];const isZambeziRep=profile.role==='Sales Representative'&&branches.some(b=>b.id===profile.branch_id&&b.is_main_store);if(isZambeziRep){const branchResult=await db.rpc('borrow_branch_options',{p_product_id:null});if(branchResult.error)throw branchResult.error;borrowBranchOptions=(branchResult.data||[]).map(b=>({id:b.branch_id,name:b.branch_name,is_main_store:b.is_main_store,active:true}))}operationsLoaded=true}

function tabsFor(){if(profile.role==='Admin')return [...(isSuper?['Client businesses']:[]),'Overview','Stock','Cylinder operations','Sales','Customers','Daily close','Data cleanup','Staff'];if(profile.role==='Sales Representative')return['New sale','My branch sales','Stock','Cylinder operations','Submit day'];if(profile.role==='Delivery Assistant')return['My deliveries'];return[]}
async function showApp(){
  $('loginCard').classList.add('hidden');$('app').classList.remove('hidden');$('logout').classList.remove('hidden');$('topSub').textContent=tenant.name+' · shared secure records';
  $('welcome').textContent=profile.role==='Admin'?'Admin workspace':profile.role==='Sales Representative'?'Sales workspace':'Delivery workspace';
  $('identity').textContent=profile.full_name+' · '+profile.login_id+' · '+(isSuper?'Super Admin':profile.role);
  $('welcomeMessage').textContent=`${profile.role==='Admin'?`Welcome, ${profile.full_name}. Your leadership keeps every Baraka branch moving forward.`:profile.role==='Sales Representative'?`Welcome, ${profile.full_name}. Every customer you serve helps Baraka grow.`:`Welcome, ${profile.full_name}. Your safe and reliable deliveries make a difference.`} ${dailyMotivation(profile.role)}`;
  $('branchLabel').textContent=profile.role==='Admin'?'All branches':branchName(profile.branch_id);activeTab=activeTab&&tabsFor().includes(activeTab)?activeTab:tabsFor()[0];armBackNavigation();pageLoading=true;render();
  try{await loadPageData(activeTab)}finally{pageLoading=false;render()}
}
function render(){const ts=tabsFor();$('tabs').innerHTML=ts.map(x=>`<button class="tab ${x===activeTab?'active':''}" onclick="go('${esc(x)}')">${esc(x)}</button>`).join('');$('content').innerHTML=pageLoading?'<div class="card loading-view" role="status">Loading this page…</div>':page(activeTab);if(!pageLoading&&activeTab==='New sale')ensureSalesControls();$('backButton').disabled=false;if(!pageLoading)bindPage()}
async function go(t,recordHistory=true){if(t===activeTab||!tabsFor().includes(t))return;if(recordHistory&&activeTab)tabHistory.push(activeTab);activeTab=t;pageLoading=true;render();try{await loadPageData(t)}catch(e){fail(e)}finally{pageLoading=false;render()}}
function homeTab(){return profile?.role==='Admin'?'Overview':profile?.role==='Sales Representative'?'New sale':'My deliveries'}
function goHome(){go(homeTab())}
function goBack(){const target=tabHistory.length?tabHistory.pop():homeTab();go(target,false)}
function armBackNavigation(){if(backGuardArmed)return;try{history.pushState({barakaAppGuard:true},'',location.href);backGuardArmed=true}catch(e){console.warn('In-app browser Back handling is unavailable.',e)}}
window.addEventListener('popstate',()=>{if(!backGuardArmed||!sessionUser)return;if($('modal')?.children.length)closeModal();else goBack();try{history.pushState({barakaAppGuard:true},'',location.href)}catch(e){console.warn('Could not restore the Baraka Back guard.',e)}})
function ensureSalesControls(){const kind=$('kind');if(!kind||$('saleCategory'))return;const categoryField=document.createElement('div');categoryField.className='field';categoryField.innerHTML=`<label>PRODUCT CATEGORY</label><select id="saleCategory">${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>`;kind.closest('.field').before(categoryField);$('saleCategory').addEventListener('change',updateSaleCategory);const rider=$('rider'),riderField=$('riderField');if(rider&&riderField){rider.insertAdjacentHTML('beforeend','<option value="other">Other</option>');const other=document.createElement('div');other.className='field hidden';other.id='otherDeliveryField';other.innerHTML='<label>OTHER DELIVERY DETAILS</label><input id="otherDeliveryDetails" maxlength="200" placeholder="Describe the delivery arrangement">';riderField.after(other);rider.addEventListener('change',toggleSaleOptions)}updateSaleCategory()}
async function refresh(){const keepTab=activeTab,keepBranch=stockBranchId,keepGasSize=stockGasSize,keepScroll=window.scrollY;await loadData();stockBranchId=keepBranch;stockGasSize=keepGasSize;await loadPageData(keepTab);render();window.scrollTo(0,keepScroll)}
async function logout(){try{if(db?.auth)await db.auth.signOut()}finally{stockBranchId='';stockGasSize=null;backGuardArmed=false;operationsLoaded=false;operationsLoading=false;refillRequests=[];storeRefills=[];borrows=[];borrowBranchOptions=[];borrowStockByKey={};tabHistory=[];sessionUser=null;profile=null;tenant=null;branches=[];products=[];stocks=[];staff=[];sales=[];customers=[];submissions=[];closures=[];tenants=[];activeTab='';dailyCloseDate=today();salesDateFilter='';salesBranchFilter='';salesSearchFilter='';pageLoading=false;$('app').classList.add('hidden');$('loginCard').classList.remove('hidden');$('logout').classList.add('hidden');$('loginId').value='';$('password').value='';say('loginStatus','Signed out.',true)}}

function dailyMotivation(role){const quotes={Admin:['Clear records today build a stronger Baraka tomorrow.','Every well-managed branch is a step forward.','Small improvements each day create lasting growth.','Your steady leadership keeps the whole team moving.'], 'Sales Representative':['Every customer served is progress. Keep going.','Honest work today creates better opportunities tomorrow.','One sale at a time, you are helping Baraka grow.','Your effort matters. Make today count.'], 'Delivery Assistant':['Ride safely, deliver with care, and be proud of your work.','Every safe delivery builds trust. Take care on the road.','Stay alert, ride safely, and return well.','Your careful work makes a real difference.']};const list=quotes[role]||quotes.Admin,day=Number(today().replaceAll('-',''))||0;return list[day%list.length]}
function page(t){if(t==='Client businesses')return clientPage();if(t==='Overview')return overviewPage();if(t==='Stock')return stockPage();if(t==='Sales')return salesPage();if(t==='Customers')return customersPage();if(t==='Daily close')return closePage();if(t==='Data cleanup')return cleanupPage();if(t==='Staff')return staffPage();if(t==='Cylinder operations')return cylinderOperationsPage();if(t==='New sale')return newSalePage();if(t==='My branch sales')return repSalesPage();if(t==='Submit day')return submitPage();return deliveryPage()}
function overviewPage(){let td=sales.filter(s=>s.sale_date===today()&&!s.cancelled_at),inc=sales.filter(s=>!s.cancelled_at&&status(s)!=='Complete');return `<div class="grid3"><div class="card kpi"><div class="label">Products</div><div class="value">${products.length}</div></div><div class="card kpi"><div class="label">Sales today</div><div class="value">${td.length}</div><div class="small">${money(td.reduce((a,x)=>a+Number(x.total),0))}</div></div><div class="card kpi"><div class="label">Incomplete sales</div><div class="value">${inc.length}</div></div></div><div class="section"><div><h2>Branch stock</h2><p>Zambezi is the main store.</p></div><button class="btn" onclick="go('Stock')">Manage stock</button></div><div class="branchgrid">${branches.map(b=>`<div class="card"><strong>${esc(b.name)}${b.is_main_store?' · Main store':''}</strong><div class="kpi value">${stocks.filter(s=>s.branch_id===b.id).reduce((n,s)=>n+Number(s.quantity),0)}</div><div class="small">units</div></div>`).join('')}</div><div class="section"><div><h2>Recent incomplete sales</h2></div><button class="btn light" onclick="go('Sales')">View sales</button></div>${salesTable(inc.slice(0,8))}`}
const GAS_SIZES=['1kg','3kg','6kg','13kg','15kg','22.5kg','25kg','45kg','50kg'];
function gasSize(p){const text=`${p.model||''} ${p.name||''}`.toLowerCase().replace(/,/g,'.');for(const size of GAS_SIZES){const n=size.replace('kg','').replace('.','\\.');if(new RegExp(`(^|[^0-9])${n}\\s*(kg)?([^0-9]|$)`,'i').test(text))return size}return 'Other size'}
function stockAlert(p,bid){const current=qtyAt(p.id,bid),base=Number(stocks.find(x=>x.product_id===p.id&&x.branch_id===bid)?.warning_target_quantity||0);if(current===0)return{cls:'bad',label:'OUT OF STOCK'};if(base>0){const declined=(base-current)/base;if(declined>=.75)return{cls:'stock-orange',label:'LOW · 75%+'};if(declined>=.5)return{cls:'warn',label:'LOW · 50%+'}}return{cls:'good',label:'IN STOCK'}}
// Stock ledger: show full + empty = total units for each product at a branch.
function stockTable(rows,bid,isGas,admin){
  if(!rows.length)return '<div class="empty">No products match this branch and category yet.</div>';
  const canLogFaulty=isGas&&(admin||(profile.role==='Sales Representative'&&branches.some(b=>b.id===profile.branch_id&&b.is_main_store)));
  const totals=rows.reduce((a,p)=>{a.full+=qtyAt(p.id,bid);a.empty+=isGas?emptyAt(p.id,bid):0;a.faulty+=isGas?faultyAt(p.id,bid):0;return a},{full:0,empty:0,faulty:0});
  return `<div class="card tablewrap"><table class="table stock-table"><thead><tr><th>Brand / product</th><th>Code</th><th>Full</th><th>Empty</th><th>Faulty</th><th>Total physical units</th><th>Stock status</th>${admin||canLogFaulty?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(p=>{const full=qtyAt(p.id,bid),empty=isGas?emptyAt(p.id,bid):0,faulty=isGas?faultyAt(p.id,bid):0,a=stockAlert(p,bid);return `<tr><td><b>${esc(p.name)}</b><div class="small">${esc(p.model)}</div></td><td class="code">${esc(p.code)}</td><td>${full}</td><td>${empty}</td><td>${faulty}</td><td class="stock-total">${full+empty+faulty}</td><td><span class="badge ${a.cls}">${a.label}</span></td>${admin||canLogFaulty?`<td><div class="inline">${admin?`<button class="btn light sm" onclick="stockForm('${p.id}','${bid}')">Edit counts</button><button class="btn light sm" onclick="editProductForm('${p.id}')">Edit product</button><button class="btn danger sm" onclick="deleteProductForm('${p.id}')">Delete product</button>`:''}${canLogFaulty?`<button class="btn light sm" onclick="faultyCylinderForm('${p.id}','${bid}')">Record faulty count</button>`:''}</div></td>`:''}</tr>`}).join('')}</tbody><tfoot><tr><td colspan="2">BRANCH TOTAL</td><td>${totals.full}</td><td>${totals.empty}</td><td>${totals.faulty}</td><td class="stock-total">${totals.full+totals.empty+totals.faulty}</td><td colspan="${admin||canLogFaulty?2:1}"></td></tr></tfoot></table></div>`;
}

function stockPage(){
  // Admins can select every branch; sales representatives see only their assigned branch.
  const branchList=profile.role==='Sales Representative'?branches.filter(b=>b.id===profile.branch_id):branches;
  if(!branchList.some(b=>b.id===stockBranchId))stockBranchId=profile.role==='Sales Representative'?profile.branch_id:'';
  const branch=branchById(stockBranchId),admin=profile.role==='Admin';
  const branchButtons=branchList.map(b=>`<button class="btn ${stockBranchId===b.id?'':'light'}" onclick="stockBranchId='${b.id}';stockGasSize=null;render()">${esc(b.name)}${b.is_main_store?' · Main store':''}</button>`).join('');
  const gas=products.filter(p=>normCategory(p.category)==='gas'&&p.active!==false);
  const gasSizes=[...GAS_SIZES,'Other size'];
  const gasRows=stockGasSize?gas.filter(p=>gasSize(p)===stockGasSize):[];
  return `<div class="section"><div><h2>Stock by branch</h2><p>${admin?'Choose a branch and cylinder size. Total units include full and empty cylinders.':'Read-only stock for your assigned branch.'}</p></div>${admin?`<div class="inline"><button class="btn light" onclick="manageProductsForm()">Manage products</button><button class="btn light" onclick="adjustCountForm()">Set branch count</button><button class="btn light" onclick="transferForm()">Transfer from Zambezi</button><button class="btn" onclick="addProductForm()">＋ Add product / stock</button></div>`:''}</div>
  <div class="card"><b>1 · Choose branch</b><div class="inline" style="margin-top:10px">${branchButtons||'<span class="muted">No branches available.</span>'}</div></div>
  ${branch?`<div class="card"><div class="between"><div><b>${esc(branch.name)}</b><div class="small">${admin?'Admin can edit counts for every branch.':'Stock view only · contact your Admin to correct counts.'}</div></div></div></div>
  <section class="category"><h3>Gas cylinders</h3><div class="card"><b>2 · Choose cylinder size</b><div class="inline" style="margin-top:10px">${gasSizes.map(sz=>`<button class="btn ${stockGasSize===sz?'':'light'}" onclick="stockGasSize='${sz}';render()">${sz}</button>`).join('')}</div></div>
  ${stockGasSize?`<div class="section"><div><h3>${esc(branch.name)} · ${esc(stockGasSize)}</h3><p>Each brand row shows Full + Empty = Total units.</p></div></div>${stockTable(gasRows,branch.id,true,admin)}`:''}</section>
  ${['Accessories','Electricals'].map(cat=>{const rows=products.filter(p=>normCategory(p.category)===normCategory(cat)&&p.active!==false);return `<section class="category"><h3>${cat}</h3>${stockTable(rows,branch.id,false,admin)}</section>`}).join('')}
  <div class="inline" style="margin:14px 0"><span class="badge good">In stock</span><span class="badge warn">Yellow: declined 50% or more</span><span class="badge stock-orange">Orange: declined 75% or more</span><span class="badge bad">Red: out of stock</span></div>`:'<div class="empty">Choose a branch above to see its stock.</div>'}`;
}

function salesTable(rows,numbered=false){
  if(!rows.length)return '<div class="empty">No sales found.</div>';
  return `<div class="card tablewrap"><table class="table"><thead><tr><th>${numbered?'No.':'Sale / date'}</th><th>Customer / destination</th><th>Branch / rep</th><th>Delivery assistant</th><th>Type / product</th><th>Total</th><th>Payment</th><th>Cylinder</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map((s,index)=>{
    const canConfirmPickup=profile.role==='Sales Representative'&&s.created_by===sessionUser.id&&s.rider_id===null;
    const canConfirmReturn=profile.role==='Admin'||canConfirmPickup;
    const canEdit=profile.role==='Admin'||(profile.role==='Sales Representative'&&s.created_by===sessionUser.id&&!isDateLocked(s.sale_date));
    const protectedCompleteRefill=profile.role==='Sales Representative'&&s.kind==='Gas refill'&&s.paid&&s.empty_returned;
    return `<tr><td>${numbered?index+1:esc(s.sale_number||s.id.slice(0,8))}<div class="small">${esc(s.sale_date)}</div></td><td>${esc(s.customer_name)}<div class="small">${esc(s.customer_phone)}</div>${s.customer_destination?`<div class="small">Delivery / destination: ${esc(s.customer_destination)}</div>`:''}</td><td>${esc(branchName(s.branch_id))}<div class="small">${esc(staffById(s.created_by)?.full_name||s.created_by_name_snapshot||'Deleted staff')} · ${esc(staffById(s.created_by)?.login_id||s.created_by_login_snapshot||'')}</div></td><td>${s.rider_id||s.rider_login_snapshot?`${esc(staffById(s.rider_id)?.full_name||s.rider_name_snapshot||'')}<div class="small">${esc(staffById(s.rider_id)?.login_id||s.rider_login_snapshot||'')}</div>`:(s.kind==='Gas refill'?(String(s.customer_destination||'').includes('Other delivery:')?'Other delivery':'Customer pick-up'):'—')}</td><td>${esc(s.kind)}<div class="small">${esc(s.product_code)} · ${esc(s.product_name)} ${esc(s.product_model)} × ${s.quantity}</div></td><td>${money(s.total)}</td><td>${s.paid?'Paid · '+esc(s.payment_method||''):'Not paid'}</td><td>${s.kind==='Gas refill'?(s.empty_returned?`Returned · ${esc(staffById(s.returned_by)?.full_name||'staff')}<div class="small">${Number(s.empty_return_quantity||0)} cylinder(s) · ${s.rider_id?'Delivery assistant':'Confirmed by Sales Rep / Admin'}</div>`:'Not returned'):'Not required'}</td><td>${badge(s)}</td><td>${!s.cancelled_at&&!s.paid&&canEdit?`<button class="btn light sm" onclick="paymentForm('${s.id}')">Record payment</button>`:''}${!s.cancelled_at&&s.kind==='Gas refill'&&!s.empty_returned&&canConfirmReturn?`<button class="btn light sm" onclick="confirmReturn('${s.id}')">Confirm returned</button>`:''}${!s.cancelled_at&&canEdit&&!protectedCompleteRefill?`<button class="btn danger sm" onclick="cancelSale('${s.id}')">Cancel sale</button>`:''}${profile.role==='Admin'?`<button class="btn danger sm" onclick="deleteSaleForm('${s.id}')">Delete permanently</button>`:''}</td></tr>`;
  }).join('')}</tbody></table></div>`;
}

function salesVisibleRows(){const q=salesSearchFilter.toLowerCase();return sales.filter(x=>(!salesDateFilter||x.sale_date===salesDateFilter)&&(!salesBranchFilter||x.branch_id===salesBranchFilter)&&(!q||[x.customer_name,x.customer_phone,x.product_name,x.product_code,String(x.sale_number)].some(v=>String(v||'').toLowerCase().includes(q)))).slice().reverse()}
function salesPage(){const shown=salesVisibleRows();return `<div class="section"><div><h2>All branch sales</h2><p>Choose a date to search older records; a selected day is numbered from 1 and sorted by product weight. Without a date this shows the latest 30 days. Monthly download is Admin-only.</p></div></div>${profile.role==='Admin'?`<div class="card"><b>Download monthly reports by branch</b><div class="inline" style="margin-top:10px">${branches.map(b=>`<button class="btn light" onclick="branchReportForm('${b.id}')">Download ${esc(b.name)} report</button>`).join('')}</div></div>`:''}<div class="card searchrow"><input id="saleDate" type="date" value="${esc(salesDateFilter)}"><select id="saleBranch"><option value="">All branches</option>${branches.map(b=>`<option value="${b.id}" ${salesBranchFilter===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select><input id="saleSearch" value="${esc(salesSearchFilter)}" placeholder="Customer, telephone, product or sale number"></div><div id="saleResults">${salesTable(salesDateFilter?shown.slice().sort(dailySaleCompare):shown,Boolean(salesDateFilter))}</div>`}
function branchReportForm(branchId=''){if(profile.role!=='Admin'){toast('Only an Admin can download branch reports.');return}if(!branches.length){toast('No branches loaded.');return}modal(`<h2>Download monthly branch records</h2><p>This downloads one sales CSV and one customer CSV for the selected branch.</p><div class="field"><label>BRANCH</label><select id="reportBranch">${branches.map(b=>`<option value="${b.id}" ${branchId===b.id?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>MONTH</label><input id="reportMonth" type="month" value="${today().slice(0,7)}"></div><button class="btn" onclick="downloadBranchMonth()">Download report files</button>`)}
function csvCell(v){let s=String(v??'');if(/^\s*[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function saveCsv(filename,headers,rows){const content=[headers,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n');const url=URL.createObjectURL(new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500)}
async function downloadBranchMonth(){try{if(profile.role!=='Admin')throw new Error('Only an Admin can download branch reports.');const branchId=$('reportBranch').value,month=$('reportMonth').value,branch=branchById(branchId);if(!branch||!/^\d{4}-\d{2}$/.test(month))throw new Error('Choose a branch and month.');const [year,mon]=month.split('-').map(Number),start=`${month}-01`,end=new Date(Date.UTC(year,mon,1)).toISOString().slice(0,10);let rows=[],offset=0;while(true){const r=await db.from('sales').select('*').eq('tenant_id',profile.tenant_id).eq('branch_id',branchId).gte('sale_date',start).lt('sale_date',end).order('sale_date').range(offset,offset+999);if(r.error)throw r.error;rows.push(...(r.data||[]));if((r.data||[]).length<1000)break;offset+=1000}if(!rows.length)throw new Error(`No sales were found for ${branch.name} in ${month}.`);const tag=branch.name.replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'');const saleCols=['sale_number','sale_date','customer_name','customer_phone','customer_destination','product_code','product_name','product_model','kind','quantity','unit_price','total','paid','payment_method','payment_reference','empty_returned','cancelled_at'];saveCsv(`Baraka-${tag}-sales-${month}.csv`,saleCols,rows.map(s=>saleCols.map(k=>s[k])));const byPhone=new Map();for(const s of rows){const key=String(s.customer_phone||'').replace(/\D/g,'');if(!key)continue;const c=byPhone.get(key)||{name:s.customer_name,phone:s.customer_phone,first:s.sale_date,last:s.sale_date,count:0};c.first=String(s.sale_date)<String(c.first)?s.sale_date:c.first;c.last=String(s.sale_date)>String(c.last)?s.sale_date:c.last;c.count++;byPhone.set(key,c)}saveCsv(`Baraka-${tag}-customers-${month}.csv`,['customer_name','telephone','first_sale_in_month','last_sale_in_month','sales_count'],[...byPhone.values()].map(c=>[c.name,c.phone,c.first,c.last,c.count]));closeModal();toast('Monthly branch sales and customer files downloaded')}catch(e){fail(e)}}
function customersPage(){return `<div class="section"><div><h2>Customer records</h2><p>Customer details from every branch in this business.</p></div></div><div class="field"><label>SEARCH NAME OR TELEPHONE</label><input id="customerSearch" placeholder="Type a name or number"></div><div id="customerResults">${customerTable(customers)}</div>`}
function customerTable(list){return list.length?`<div class="card tablewrap"><table class="table"><thead><tr><th>Name</th><th>Telephone</th><th>Added</th></tr></thead><tbody>${list.map(c=>`<tr><td>${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${new Date(c.created_at).toLocaleDateString()}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No customer records yet.</div>'}

function dailySaleMeta(s){const p=productById(s.product_id),category=p?.category||(s.kind==='Gas refill'?'Gas':'Other'),isGas=normCategory(category)==='gas'||s.kind==='Gas refill';let weight=isGas?(p?gasSize(p):'Other size'):'—';if(isGas&&weight==='Other size'){const t=`${s.product_name||''} ${s.product_model||''}`.toLowerCase().replace(/,/g,'.');weight=GAS_SIZES.find(w=>{const n=w.replace('kg','').replace('.','\\.');return new RegExp(`(^|[^0-9])${n}\\s*(kg)?([^0-9]|$)`,'i').test(t)})||'Other size'}return{category:isGas?'Gas':category,weight,brand:s.product_name||p?.name||'Unknown product',model:s.product_model||p?.model||''}}
function dailySaleCompare(a,b){const x=dailySaleMeta(a),y=dailySaleMeta(b),cat=(x.category==='Gas'?0:1)-(y.category==='Gas'?0:1);if(cat)return cat;const wx=parseFloat(x.weight)||999,wy=parseFloat(y.weight)||999;return wx-wy||x.brand.localeCompare(y.brand,'en',{sensitivity:'base'})||x.model.localeCompare(y.model,'en',{sensitivity:'base'})||(new Date(a.created_at||`${a.sale_date}T00:00:00`).getTime()-new Date(b.created_at||`${b.sale_date}T00:00:00`).getTime())||String(a.id||'').localeCompare(String(b.id||''))}
function dailySalesPanel(rows){const totals=new Map();for(const s of rows.filter(x=>!x.cancelled_at)){const m=dailySaleMeta(s),key=[m.category,m.weight,m.brand,m.model].join('|'),v=totals.get(key)||{...m,units:0,amount:0,count:0};v.units+=Number(s.quantity)||0;v.amount+=Number(s.total)||0;v.count++;totals.set(key,v)}const groups=[...totals.values()].sort((a,b)=>{const c=(a.category==='Gas'?0:1)-(b.category==='Gas'?0:1);return c||((parseFloat(a.weight)||999)-(parseFloat(b.weight)||999))||a.brand.localeCompare(b.brand,'en',{sensitivity:'base'})||a.model.localeCompare(b.model,'en',{sensitivity:'base'})});const summary=groups.length?`<div class="card tablewrap"><table class="table"><thead><tr><th>No.</th><th>Category</th><th>Weight</th><th>Brand / product</th><th>Sales</th><th>Units</th><th>Sales total</th></tr></thead><tbody>${groups.map((g,i)=>`<tr><td>${i+1}</td><td>${esc(g.category)}</td><td>${esc(g.weight)}</td><td>${esc(g.brand)}<div class="small">${esc(g.model)}</div></td><td>${g.count}</td><td><b>${g.units}</b></td><td>${money(g.amount)}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="5">DAY TOTAL</td><td>${groups.reduce((n,g)=>n+g.units,0)}</td><td>${money(groups.reduce((n,g)=>n+g.amount,0))}</td></tr></tfoot></table></div>`:'<div class="empty">No active sales for this date.</div>';return `<div class="section"><h3>Totals by weight and product</h3></div>${summary}<div class="section"><h3>Sale records · numbered by weight category</h3></div>${salesTable(rows.slice().sort(dailySaleCompare),true)}`}
function closePage(){const d=$('closeDate')?.value||today(),rows=sales.filter(s=>s.sale_date===d),activeRows=rows.filter(s=>!s.cancelled_at),closed=closures.some(x=>x.business_date===d),daySubmissions=submissions.filter(x=>x.business_date===d),locked=closed||daySubmissions.length>0;return `<div class="section"><div><h2>Daily close</h2><p>Close a date to lock it. Reopen a locked date if a Sales Representative needs to correct an entry.</p></div></div><div class="card inline"><div class="field" style="margin:0"><label>BUSINESS DATE</label><input id="closeDate" type="date" value="${d}" max="${today()}"></div><span class="badge ${locked?'good':'warn'}">${closed?'Closed':daySubmissions.length?'Submitted':'Open'}</span>${locked?`<button class="btn light" onclick="reopenDay('${d}')">Reopen / unlock this date</button>`:`<button class="btn" onclick="closeDay('${d}')">Close this date</button>`}<span>${activeRows.length} sales · ${money(activeRows.reduce((n,s)=>n+Number(s.total),0))}</span></div><div class="section"><h2>Sales for ${d}</h2></div>${dailySalesPanel(rows)}<div class="section"><h2>Staff submissions</h2></div><div class="card">${staff.filter(s=>s.role==='Sales Representative').map(x=>{let done=submissions.some(y=>y.user_id===x.user_id&&y.business_date===d);return `<div class="between" style="padding:8px;border-bottom:1px solid var(--line)"><span>${esc(x.full_name)} · ${esc(branchName(x.branch_id))} <span class="small">${esc(x.login_id)}</span></span><span class="badge ${done?'good':'warn'}">${done?'Submitted':'Not submitted'}</span></div>`}).join('')||'<div class="empty">No sales representatives yet.</div>'}</div>`}
function cleanupPage(){if(profile.role!=='Admin')return '<div class="empty">Admin access required.</div>';return `<div class="section"><div><h2>Data cleanup</h2><p>Remove dummy records or reset selected stock for ${esc(tenant?.name||'this business')}.</p></div><button class="btn light" onclick="manageProductsForm()">Manage / delete products</button></div><div class="notice"><b>Permanent actions:</b> Individual sales and products can also be deleted from their own lists. Clearing a business removes its recorded sales, customer details, submissions, closures and cylinder-operation history. Staff logins and branches are kept.</div><div class="card"><h3>Delete selected records</h3><p>Choose a record type and optional filters. Leave filters blank to delete all records of that type in this business. Completed and accepted records are included.</p><div class="grid2"><div class="field"><label>RECORD TYPE</label><select id="cleanupType"><option value="sales">Sales records</option><option value="borrows">Borrow / loan records</option><option value="branch_refills">Branch replacement requests</option><option value="store_refills">Zambezi refill trips</option><option value="submissions">Daily sales submissions</option><option value="closures">Daily closures</option><option value="stock_counts">Stock counts · reset to zero</option><option value="products">Products and their history</option></select></div><div class="field"><label>BRANCH · OPTIONAL</label><select id="bulkDeleteBranch"><option value="">All branches</option>${branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>PRODUCT · OPTIONAL</label><select id="bulkDeleteProduct"><option value="">All products</option>${products.map(x=>`<option value="${x.id}">${esc(x.name)} · ${esc(x.model)}</option>`).join('')}</select></div><div class="field"><label>BUSINESS DATE · OPTIONAL</label><input id="bulkDeleteDate" type="date"></div></div><button class="btn danger" onclick="bulkDeleteForm()">Review delete action</button></div><div class="grid2"><div class="card"><h3>Reset selected stock counts</h3><p class="small">Set full, empty and faulty counts to zero. Product names, generated codes and history stay in place.</p><div class="field"><label>BRANCH</label><select id="cleanupBranch"><option value="">All branches</option>${branches.map(b=>`<option value="${b.id}">${esc(b.name)}</option>`).join('')}</select></div><div class="field"><label>PRODUCT</label><select id="cleanupProduct"><option value="">All products</option>${products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${esc(p.model)} · ${esc(p.code||'no code')}</option>`).join('')}</select></div><button class="btn danger" onclick="resetSelectedStockForm()">Reset selected counts</button></div><div class="card"><h3>Clear dummy activity</h3><p>This clears all branches’ sales, customer records, daily submissions and closures, borrow / refill history, and on-hand counts. Your business, branches and staff logins stay.</p><button class="btn danger" onclick="clearDummyDataForm(false)">Clear activity and stock; keep products</button><p class="small">To remove old product records and generated codes too:</p><button class="btn danger" onclick="clearDummyDataForm(true)">Clear everything, including products and codes</button></div></div><div class="card"><b>Before clearing:</b> download any reports you need. These deletions cannot be undone.</div>`}
function bulkDeleteForm(){if(profile.role!=='Admin')return toast('Admin access required.');const type=$('cleanupType').value,branch=$('bulkDeleteBranch').value,product=$('bulkDeleteProduct').value,date=$('bulkDeleteDate').value,label=$('cleanupType').selectedOptions[0].text,branchLabel=branch?branchName(branch):'all branches',productLabel=product?`${productById(product)?.name||'selected product'} · ${productById(product)?.model||''}`:'all products',scope=`${label} for ${branchLabel}${productLabel==='all products'?'':' · '+productLabel}${date?' · '+date:''}`;modal(`<h2>Confirm permanent action</h2><div class="notice"><b>${esc(scope)}</b><br><br>This can delete completed sales, accepted borrow records, fulfilled refill requests and recorded refill trips. Historical records will be removed and stock counts will <b>not</b> be automatically recalculated. Review or correct counts after deleting history. Stock-count action sets selected counts to zero; product deletion removes products and their history across all branches.</div><p>Type <b>DELETE</b> to continue. Cancel closes this message without changes.</p><div class="field"><label>TYPE DELETE TO CONFIRM</label><input id="bulkDeletePhrase" autocomplete="off"></div><button class="btn danger" onclick="bulkDeleteSelected()">Confirm action</button> <button class="btn light" onclick="closeModal()">Cancel</button>`)}
async function bulkDeleteSelected(){try{if(profile.role!=='Admin')throw new Error('Admin access required.');if($('bulkDeletePhrase')?.value.trim()!=='DELETE')throw new Error('Type DELETE exactly. Nothing was changed.');const type=$('cleanupType').value,branch=$('bulkDeleteBranch').value||null,product=$('bulkDeleteProduct').value||null,date=$('bulkDeleteDate').value||null;if(type==='closures'&&(branch||product))throw new Error('Daily closures support a date filter only. Clear branch and product filters.');if(type==='products'&&(branch||date))throw new Error('Product deletion applies across all branches and cannot be filtered by date. Clear those filters.');const r=await db.rpc('admin_delete_selected_records',{p_record_type:type,p_branch_id:branch,p_product_id:product,p_business_date:date});if(r.error)throw r.error;const n=Number(r.data?.affected||0);operationsLoaded=false;closeModal();await loadData();render();toast(type==='stock_counts'?`Reset ${n} stock row(s) to zero.`:type==='products'?`Deleted ${n} product(s) and their linked records.`:`Deleted ${n} ${type.replaceAll('_',' ')} record(s). Stock was unchanged; review counts.`)}catch(e){fail(e)}}
function faultyCylinderForm(pid,bid){const isZambeziRep=profile.role==='Sales Representative'&&branches.some(b=>b.id===profile.branch_id&&b.is_main_store);if(profile.role!=='Admin'&&!isZambeziRep)return toast('Only an Admin or Zambezi Sales Representative can record faulty cylinders.');const p=productById(pid);if(!p||normCategory(p.category)!=='gas')return toast('Faulty-cylinder tracking is for Gas products.');const targetOptions=isZambeziRep?`<div class="field"><label>BRANCH WITH FAULTY CYLINDERS</label><select id="faultyBranchSelect" onchange="updateFaultyValue('${pid}')">${branches.map(b=>`<option value="${b.id}" ${b.id===bid?'selected':''}>${esc(b.name)}</option>`).join('')}</select></div>`:'';modal(`<h2>Record faulty cylinders</h2><p>${esc(p.name)} ${esc(p.model)}</p>${targetOptions||`<p>Branch: ${esc(branchName(bid))}</p>`}<div class="notice">Enter the current number of faulty cylinders physically at this branch. This count does not change full or empty quantities.</div><div class="field"><label>FAULTY CYLINDERS</label><input id="faultyQtyInput" type="number" min="0" step="1" value="${faultyAt(pid,bid)}"></div><button class="btn" onclick="saveFaultyCylinderCount('${pid}','${bid}')">Save faulty count</button>`)}

function resetSelectedStockForm(){if(profile.role!=='Admin')return toast('Admin access required.');const branchId=$('cleanupBranch').value,productId=$('cleanupProduct').value,b=branchId?branchById(branchId):null,p=productId?productById(productId):null;const scope=`${b?.name||'all branches'} · ${p?`${p.name} ${p.model}`:'all products'}`;modal(`<h2>Reset stock counts?</h2><div class="notice">Set full and empty counts to zero for <b>${esc(scope)}</b>. Product records and sales history will remain.</div><p>Type <b>RESET STOCK</b> to continue.</p><div class="field"><label>CONFIRMATION</label><input id="resetStockPhrase" autocomplete="off"></div><button class="btn danger" onclick="resetSelectedStock()">Reset these counts</button><button class="btn light" style="margin-left:8px" onclick="closeModal()">Cancel</button>`)}

function clearDummyDataForm(includeProducts){if(profile.role!=='Admin')return toast('Admin access required.');const label=includeProducts?'including every product and generated code':'keeping the product list and codes';modal(`<h2>Clear ${includeProducts?'all':'dummy'} business data?</h2><div class="notice">This permanently deletes sales, customer details, submissions, closures, cylinder borrow/refill history, and resets full, empty and faulty stock counts for every branch, ${label}. Branches and staff logins remain.</div><p>Type the business name <b>${esc(tenant.name)}</b> to confirm.</p><div class="field"><label>BUSINESS NAME</label><input id="clearBusinessName" autocomplete="off"></div><button class="btn danger" onclick="clearDummyData(${includeProducts})">Permanently clear selected data</button><button class="btn light" style="margin-left:8px" onclick="closeModal()">Cancel</button>`)}

function resetBusinessDataForm(tenantId){
  if(!isSuper||profile.login_id!=='SUPER-ADMIN-001'){toast('Super Admin access required.');return}
  const t=tenants.find(x=>x.id===tenantId);if(!t){toast('Business not found.');return}
  modal(`<h2>Clear recorded work for ${esc(t.name)}</h2><div class="notice"><b>This permanently deletes:</b> all sales and sale history, customer records, products, branch stock counts, sales submissions, daily closures, borrow records, and refill records for this business.<br><br><b>It keeps:</b> the business, branches, subscription, and all staff logins.</div><p>To confirm, type the business name exactly:</p><div class="field"><label>BUSINESS NAME</label><input id="resetBusinessName" autocomplete="off"></div><button class="btn danger" onclick="resetBusinessWork('${t.id}')">Permanently clear this business data</button><button class="btn light" style="margin-left:8px" onclick="closeModal()">Cancel</button>`);
}

async function resetBusinessWork(tenantId){
  try{
    if(!isSuper||profile.login_id!=='SUPER-ADMIN-001')throw new Error('Super Admin access required.');
    const t=tenants.find(x=>x.id===tenantId),typed=$('resetBusinessName')?.value.trim();
    if(!t)throw new Error('Business not found.');
    if(typed!==t.name)throw new Error('The name does not match. Nothing was deleted.');
    if(!confirm(`Permanently clear sales, customers, products, stock counts, submissions and daily closures for ${t.name}?`))return;
    const {data,error}=await db.rpc('reset_business_work',{p_tenant_id:tenantId,p_confirm_name:typed});
    if(error)throw error;
    await loadData();render();
    modal(`<h2>Business data cleared</h2><div class="notice">${esc(t.name)} is ready for new product and stock entries.<br>Deleted: ${Number(data?.sales_deleted||0)} sales, ${Number(data?.customers_deleted||0)} customers, ${Number(data?.products_deleted||0)} products, ${Number(data?.stock_rows_deleted||0)} stock rows, ${Number(data?.borrow_records_deleted||0)} borrow records, ${Number(data?.branch_requests_deleted||0)} refill requests, ${Number(data?.refill_batches_deleted||0)} refill batches, ${Number(data?.submissions_deleted||0)} submissions, and ${Number(data?.closures_deleted||0)} daily closures.<br><br>Staff logins, branches, and subscription remain.</div><button class="btn" onclick="closeModal()">Done</button>`);
  }catch(e){fail(e)}
}

function newSalePage(){const closed=closures.some(x=>x.business_date===today()),submitted=submissions.some(x=>x.user_id===sessionUser.id&&x.business_date===today()),locked=closed||submitted,mine=profile.branch_id;return `<div class="section"><div><h2>Enter a sale</h2><p>Sale will be recorded at ${esc(branchName(mine))} and under login ${esc(profile.login_id)}.</p></div></div>${locked?`<div class="notice">${closed?'Admin has closed today’s sales. Ask the Admin to reopen today if you need to correct an entry.':'You have submitted today’s sales. Ask the Admin to reopen today if you need to correct an entry.'}</div>`:''}<div class="grid2"><div class="card"><div class="field"><label>SALE TYPE</label><select id="kind"><option>Gas refill</option><option>Complete sale</option></select></div><div class="field"><label>PRODUCT</label><select id="saleProduct"></select><div class="small">Choose the product by name and model. No code or scan is required.</div></div><div class="field"><label>QUANTITY</label><input id="saleQty" type="number" min="1" value="1"></div><div class="field"><label>ACTUAL UNIT SELLING PRICE · KES</label><input id="saleUnitPrice" type="number" min="0" step="0.01" value="0" inputmode="decimal"></div><div class="field"><label>CUSTOMER NAME</label><input id="customerName" oninput="toggleDestinationField()"></div><div class="field hidden" id="destinationField"><label>DELIVERY DESTINATION / PICK-UP LOCATION · REQUIRED IF NAME IS BLANK</label><input id="customerDestination" placeholder="Enter area, estate, landmark, or pick-up point"></div><div class="field"><label>CUSTOMER TELEPHONE</label><div class="phone-input"><span class="flag" aria-label="Kenya flag">🇰🇪</span><span class="prefix">+254</span><input id="customerPhone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="9" placeholder="712345678" aria-describedby="customerPhoneHelp"></div><div class="small" id="customerPhoneHelp">Enter 9 digits beginning with 7 or 1. Kenya’s +254 prefix is already added.</div></div><div class="field"><label>PAYMENT RECEIVED?</label><select id="paid"><option value="no">No · incomplete</option><option value="yes">Yes · paid</option></select></div><div class="field"><label>PAYMENT METHOD</label><select id="payMethod"><option>Cash</option><option>M-Pesa</option><option>Other</option></select></div><div class="field"><label>PAYMENT REFERENCE (OPTIONAL)</label><input id="payRef"></div><div class="field hidden" id="riderField"><label>DELIVERY ASSISTANT / CUSTOMER PICK-UP</label><select id="rider"><option value="">Choose delivery option</option><option value="pickup">Customer pick-up</option>${staff.filter(s=>s.role==='Delivery Assistant'&&s.active).map(s=>`<option value="${s.user_id}">${esc(s.full_name)} · ${esc(s.login_id)}</option>`).join('')}</select></div><div class="field hidden" id="pickupReturnField"><label>EMPTY CYLINDERS RETURNED AT PICK-UP?</label><div class="small">Yes means all cylinders in this sale quantity have returned. If some are still out, choose No and confirm when the return is complete.</div><select id="pickupReturned"><option value="no">No · still waiting</option><option value="yes">Yes · returned to branch</option></select></div><button id="recordSaleBtn" class="btn" ${locked?'disabled':''} onclick="recordSale()">Record sale</button></div><div class="card"><h3>When is a sale complete?</h3><p>Complete sale: payment only. Gas refill: payment and the empty cylinder return.</p><div class="notice">Enter the actual price charged on this sale. Different items and customers may have different prices.</div><div id="avail" class="small" style="margin-top:12px"></div></div></div>`}
function repSalesPage(){return `<div class="section"><div><h2>My branch sales</h2><p>Past sales can be viewed here. Each date starts at 1 and is sorted by product weight.</p></div></div><div class="field"><label>DATE</label><input id="repDate" type="date" max="${today()}" value="${today()}"></div><div id="repResults">${salesTable(sales.filter(s=>s.sale_date===today()).slice().sort(dailySaleCompare),true)}</div>`}
function submitPage(){let done=submissions.some(x=>x.user_id===sessionUser.id&&x.business_date===today()),rows=sales.filter(s=>s.created_by===sessionUser.id&&s.sale_date===today()&&!s.cancelled_at);return `<div class="section"><div><h2>Submit today’s sales</h2><p>Submitting records your empty cylinders as awaiting exchange. They stay on this branch’s stock until Zambezi confirms the matching full-cylinder replacement.</p></div></div><div class="card between"><span>${rows.length} sales · ${money(rows.reduce((n,s)=>n+Number(s.total),0))}</span>${done?'<span class="badge good">Submitted · locked</span>':`<button class="btn" onclick="submitToday()">Submit sales and refill needs</button>`}</div><div class="notice">After submission, your sales are locked and an exchange request is created by brand and weight. Empty cylinders remain counted at your branch until Admin confirms that full replacements have been handed over.</div>`}
function deliveryPage(){
  const rows=sales.filter(s=>s.rider_id===sessionUser.id&&!s.cancelled_at).slice().sort((a,b)=>String(b.sale_date).localeCompare(String(a.sale_date))||String(b.created_at||'').localeCompare(String(a.created_at||'')));
  const totals=new Map();
  for(const s of rows){const p=productById(s.product_id),key=[s.branch_id,s.product_id,s.product_name,s.product_model].join('|'),v=totals.get(key)||{branch:s.branch_id,name:s.product_name||p?.name||'Unknown product',model:s.product_model||p?.model||'',units:0,orders:0};v.units+=Number(s.quantity)||0;v.orders++;totals.set(key,v)}
  const summary=[...totals.values()].sort((a,b)=>branchName(a.branch).localeCompare(branchName(b.branch),'en',{sensitivity:'base'})||a.name.localeCompare(b.name,'en',{sensitivity:'base'})||a.model.localeCompare(b.model,'en',{sensitivity:'base'}));
  const summaryTable=summary.length?`<div class="card tablewrap"><table class="table"><thead><tr><th>Branch</th><th>Product</th><th>Units assigned</th><th>Deliveries</th></tr></thead><tbody>${summary.map(x=>`<tr><td>${esc(branchName(x.branch))}</td><td><b>${esc(x.name)}</b><div class="small">${esc(x.model)}</div></td><td><b>${x.units}</b></td><td>${x.orders}</td></tr>`).join('')}</tbody><tfoot><tr><td colspan="2">TOTAL</td><td>${summary.reduce((n,x)=>n+x.units,0)}</td><td>${summary.reduce((n,x)=>n+x.orders,0)}</td></tr></tfoot></table></div>`:'<div class="empty">No products are assigned to your deliveries yet.</div>';
  const records=rows.map(s=>`<tr><td>${esc(s.sale_date)}</td><td>${esc(branchName(s.branch_id))}</td><td><b>${esc(s.product_name||productById(s.product_id)?.name||'Unknown product')}</b><div class="small">${esc(s.product_model||productById(s.product_id)?.model||'')}</div></td><td>${Number(s.quantity)||0}</td><td>${s.paid?'Paid':'Pending'}</td><td>${s.kind==='Gas refill'?(s.empty_returned?'Returned':'Not returned'):'Not required'}</td><td>${s.kind==='Gas refill'?`${s.rider_picked_at?`<span class="badge good">Picked up</span>`:`<button class="btn sm" onclick="pickDelivery('${s.id}')">Pick up</button>`}${s.empty_returned?'<span class="badge good" style="margin-left:6px">Return confirmed</span>':` <button class="btn light sm" onclick="returnCylinder('${s.id}')">Confirm empty returned</button>`}`:'—'}</td></tr>`).join('');
  return `<div class="section"><div><h2>My deliveries</h2><p>Product and unit totals for the sales assigned to you. Ride safely and take care on the road.</p></div></div><div class="section"><h3>Products and units</h3></div>${summaryTable}<div class="section"><h3>Assigned delivery records</h3></div>${records?`<div class="card tablewrap"><table class="table"><thead><tr><th>Date</th><th>Branch</th><th>Product</th><th>Units</th><th>Payment</th><th>Cylinder return</th><th>Action</th></tr></thead><tbody>${records}</tbody></table></div>`:'<div class="empty">No assigned delivery records.</div>'}`
}

function refillCylinderKg(product){const size=product?gasSize(product):'Other size';return size==='Other size'?null:Number.parseFloat(size)}
function storeRefillDailyRows(){const totals=new Map();for(const batch of storeRefills){const date=batch.business_date||String(batch.created_at||'').slice(0,10),p=productById(batch.product_id),kg=Number(batch.cylinder_weight_kg)||refillCylinderKg(p),row=totals.get(date)||{date,units:0,kilograms:0,unknown:0};row.units+=Number(batch.quantity_sent||0);if(kg)row.kilograms+=kg*Number(batch.quantity_sent||0);else row.unknown+=Number(batch.quantity_sent||0);totals.set(date,row)}return [...totals.values()].sort((a,b)=>b.date.localeCompare(a.date))}
function cylinderOperationsPage(){
  const main=branches.find(b=>b.is_main_store),isRep=profile.role==='Sales Representative';

  const borrowButton=profile.role==='Admin'||isRep?`<button class="btn light" onclick="borrowForm()">＋ Request cylinder borrow</button>`:'';
  const storeTools=isStore&&isRep?`<button class="btn" onclick="storeRefillForm()">＋ Send empties for refill</button>`:'';
  return `<div class="section"><div><h2>Cylinder operations</h2><p>Track refilling at Zambezi, daily branch cylinder requests, and branch borrowing.</p></div><div class="inline">${borrowButton}${storeTools}</div></div>${branchPicker}<div class="card"><h3>${esc(selected?.name||'Select a branch')} · Full and empty cylinders</h3><p class="small">The total is the sum of full and empty units for each matching brand and weight.</p><div class="tablewrap"><table class="table"><thead><tr><th>Brand</th><th>Full</th><th>Empty</th><th>At refiller</th><th>Total tracked</th></tr></thead><tbody>${gasRows||'<tr><td colspan="5">No Gas products have been added.</td></tr>'}</tbody></table></div></div>
  ${isStore?`<div class="section"><div><h3>Zambezi refill totals by day</h3><p>Daily weight is the sum of cylinder kg multiplied by units sent.</p></div></div><div class="card tablewrap"><table class="table"><thead><tr><th>Business date</th><th>Cylinders sent</th><th>Total cylinder weight</th><th>Weight setup</th></tr></thead><tbody>${storeRefillDailyRows().map(d=>`<tr><td>${esc(d.date)}</td><td>${d.units}</td><td>${d.kilograms.toLocaleString()} kg</td><td>${d.unknown?`${d.unknown} cylinder(s) need a product weight`: 'Complete'}</td></tr>`).join('')||'<tr><td colspan="4">No refill batches yet.</td></tr>'}</tbody></table></div><div class="section"><div><h3>Zambezi refilling trips</h3><p>New dispatches are entered by Zambezi Sales Representatives. Admin may correct a record.</p></div></div><div class="card tablewrap"><table class="table"><thead><tr><th>Brand / weight</th><th>Sent empty</th><th>Returned full</th><th>Still away</th><th>Total kg</th><th>Sent date</th><th>Action</th></tr></thead><tbody>${storeRows||'<tr><td colspan="7">No cylinders have been sent for refill yet.</td></tr>'}</tbody></table></div>`:''}
  <div class="section"><div><h3>${isStore?'Empty cylinders exchanged from branches':'Branch replacement requests'}</h3><p>${isStore?'Each row records empties received by Zambezi when matching full replacements are confirmed.':'Submitted empties remain counted at their originating branch until Admin confirms matching full replacements.'} Replacements keep the exact brand and weight.</p></div></div><div class="card tablewrap"><table class="table"><thead><tr><th>Origin branch</th><th>Brand / weight</th><th>Sales date</th><th>Empties awaiting exchange</th><th>Fulls delivered</th><th>Balance / deficit</th><th>Admin action</th></tr></thead><tbody>${refillRows||'<tr><td colspan="7">No replacement requests yet. Submit branch sales to send recorded empties to Zambezi.</td></tr>'}</tbody></table></div>

}

function fulfillRefillForm(id,open){modal(`<h2>Confirm cylinders delivered</h2><p>Confirm the matching brand and weight received at the branch. Unfilled units stay listed as a balance.</p><div class="field"><label>FULL CYLINDERS DELIVERED</label><input id="fulfillQty" type="number" min="1" max="${open}" value="${open}"></div><button class="btn" onclick="fulfillRefill('${id}',${open})">Confirm delivery</button>`)}

async function borrowForm(){try{const br=await db.rpc('borrow_branch_options',{p_product_id:null});if(br.error)throw br.error;borrowBranchOptions=(br.data||[]).map(x=>({id:x.branch_id,name:x.branch_name,is_main_store:x.is_main_store,active:true}));borrowStockByKey={}}catch(e){fail(e);return}const rep=profile.role==='Sales Representative',mine=rep?profile.branch_id:'',outs=rep?[branchById(mine)].filter(Boolean):borrowBranchOptions,gas=products.filter(p=>p.active&&normCategory(p.category)==='gas'),brands=[...new Set(gas.map(p=>String(p.name||'').trim()).filter(Boolean))];modal(`<h2>Request cylinder borrow</h2>${rep?`<div class="notice">Borrowing branch: ${esc(branchName(mine))}</div>`:`<div class="field"><label>REQUESTING BRANCH</label><select id="borrowFrom" onchange="updateBorrowLenders()">${outs.map(b=>`<option value="${b.id}" ${b.is_main_store?'selected':''}>${esc(b.name)}${b.is_main_store?' · Main store':''}</option>`).join('')}</select></div>`}<div class="field"><label>SELECT LENDING BRANCH</label><select id="borrowLender"></select></div><div class="field"><label>CYLINDER BRAND</label><select id="borrowBrand" onchange="updateBorrowWeights()"><option value="">Choose brand</option>${brands.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('')}</select></div><div class="field"><label>WEIGHT CATEGORY</label><select id="borrowWeight" onchange="resolveBorrowProduct()"><option value="">Choose brand first</option></select></div><div id="borrowProductMatch" class="small" aria-live="polite">Select a brand and weight category.</div><div id="borrowStockInfo" class="notice">Choose a branch, brand, and weight to see available stock.</div><input id="borrowProduct" type="hidden"><div class="field"><label>FULL CYLINDERS NEEDED</label><input id="borrowQty" type="number" min="1" value="1" oninput="updateBorrowStockInfo()"></div><div class="notice">Only Admin can accept this request. Sales representatives may request an exact cylinder only after that brand and weight is out of full stock at their branch. A non-Zambezi branch must have matching sale-generated empties recorded before Admin can accept; Zambezi's empty balance is owed to the selected lender.</div><button id="borrowSubmit" class="btn" onclick="createBorrow()">Send borrow request</button>`);updateBorrowLenders()}
function updateBorrowWeights(){const brand=$('borrowBrand')?.value,weight=$('borrowWeight');if(!weight)return;const vals=[...new Set(products.filter(p=>p.active&&normCategory(p.category)==='gas'&&String(p.name||'').trim()===brand).map(gasSize))];weight.innerHTML='<option value="">Choose weight</option>'+vals.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');$('borrowProduct').value='';$('borrowProductMatch').textContent=vals.length?'Choose the cylinder weight.':'No Gas products found for this brand.';updateBorrowStockInfo()}
async function resolveBorrowProduct(){const brand=$('borrowBrand')?.value,weight=$('borrowWeight')?.value,matches=products.filter(p=>p.active&&normCategory(p.category)==='gas'&&String(p.name||'').trim()===brand&&gasSize(p)===weight),out=$('borrowProductMatch');$('borrowProduct').value=matches.length===1?matches[0].id:'';if(matches.length!==1){out.textContent=matches.length?`More than one product matches this brand and weight. Ask Admin to make product names/models unique.`:'No exact product match. Ask Admin to check the Gas product brand and weight.';$('borrowStockInfo').textContent='No unique matching stock item was found.';$('borrowSubmit').disabled=true;return}const p=matches[0];out.textContent=`Matched exact stock item: ${p.name} · ${p.model}. Checking each branch's stock…`;try{const result=await db.rpc('borrow_branch_options',{p_product_id:p.id});if(result.error)throw result.error;borrowBranchOptions=(result.data||[]).map(x=>({id:x.branch_id,name:x.branch_name,is_main_store:x.is_main_store,active:true}));borrowStockByKey=Object.fromEntries((result.data||[]).map(x=>[`${x.branch_id}:${p.id}`,Number(x.available_quantity||0)]));updateBorrowLenders();out.textContent=`Matched exact stock item: ${p.name} · ${p.model}. Branch availability is shown in the lender list.`}catch(e){fail(e);$('borrowStockInfo').textContent='Could not read branch stock. Ask Admin to check the borrow stock access update.';$('borrowSubmit').disabled=true}}
function updateBorrowLenders(){const source=$('borrowFrom'),target=$('borrowLender');if(!target)return;const sourceId=source?.value||profile.branch_id,current=target.value,pid=$('borrowProduct')?.value;target.innerHTML='<option value="">Choose a lending branch</option>'+borrowBranchOptions.filter(b=>b.id!==sourceId).map(b=>{const stock=pid?Number(borrowStockByKey[`${b.id}:${pid}`]||0):null;return `<option value="${b.id}">${esc(b.name)}${b.is_main_store?' · Main store':''}${stock===null?'':` · ${stock} full`}</option>`}).join('');if([...target.options].some(o=>o.value===current))target.value=current;target.onchange=updateBorrowStockInfo;updateBorrowStockInfo()}
function updateBorrowStockInfo(){const product=$('borrowProduct')?.value,branchId=$('borrowLender')?.value,info=$('borrowStockInfo'),button=$('borrowSubmit');if(!info||!button)return;const p=productById(product),b=branchById(branchId);if(!p||!b){info.textContent='Choose a lending branch, brand, and weight to see available stock.';button.disabled=true;return}const available=Number(borrowStockByKey[`${b.id}:${p.id}`]||0),requesterId=$('borrowFrom')?.value||profile.branch_id,ownFull=Number(borrowStockByKey[`${requesterId}:${p.id}`]||0),needed=Number($('borrowQty')?.value||1);info.textContent=ownFull>0?`Your branch still has ${ownFull} full ${p.name} ${gasSize(p)} cylinder(s). Borrow requests open when this stock reaches zero.`:`${b.name} has ${available} full ${p.name} ${gasSize(p)} cylinder(s) available.`;button.disabled=available<1||ownFull>0||!Number.isInteger(needed)||needed<1||needed>available}
async function createBorrow(){try{const rep=profile.role==='Sales Representative',requester=rep?profile.branch_id:$('borrowFrom').value,lender=$('borrowLender').value,product=$('borrowProduct').value,quantity=Number($('borrowQty').value);if(!requester||!lender||!product||!Number.isInteger(quantity)||quantity<1)throw new Error('Choose requesting and lending branches, an exact Gas brand and weight, and a whole quantity.');if(!borrowBranchOptions.some(b=>b.id===requester)||!borrowBranchOptions.some(b=>b.id===lender))throw new Error('Choose active branches from this business.');const available=Number(borrowStockByKey[`${lender}:${product}`]||0),ownFull=Number(borrowStockByKey[`${requester}:${product}`]||0);if(ownFull>0)throw new Error(`Borrowing is allowed after your branch's matching full stock reaches zero; ${ownFull} full unit(s) remain.`);if(quantity>available)throw new Error(`${branchName(lender)} has only ${available} full units of this matching product. Refresh and choose an available quantity.`);const r=await db.rpc('request_cylinder_borrow',{p_requester_branch_id:requester,p_lender_branch_id:lender,p_product_id:product,p_quantity:quantity});if(r.error)throw r.error;closeModal();await refresh();toast('Borrow request sent to '+branchName(lender))}catch(e){fail(e)}}

function bindPage(){if(activeTab==='Cylinder operations'&&!operationsLoaded&&!operationsLoading){operationsLoading=true;loadCylinderData().then(()=>render()).catch(fail).finally(()=>operationsLoading=false)}if(activeTab==='Stock'){}if(activeTab==='Sales'){['saleDate','saleBranch','saleSearch'].forEach(id=>$(id)?.addEventListener(id==='saleSearch'?'input':'change',filterSales))}if(activeTab==='Customers')$('customerSearch')?.addEventListener('input',filterCustomers);if(activeTab==='Daily close')$('closeDate')?.addEventListener('change',()=>{dailyCloseDate=$('closeDate').value;Promise.all([loadSalesForDate(dailyCloseDate),db.from('daily_submissions').select('*').eq('tenant_id',profile.tenant_id),db.from('daily_closures').select('*').eq('tenant_id',profile.tenant_id)]).then(([,sr,cr])=>{if(sr.error)throw sr.error;if(cr.error)throw cr.error;submissions=sr.data||[];closures=cr.data||[];render()}).catch(fail)});if(activeTab==='New sale'){populateProductSelect();$('kind').addEventListener('change',()=>{populateProductSelect();toggleSaleOptions()});$('saleProduct').addEventListener('change',()=>{showAvailability();$('saleUnitPrice').value='0'});$('rider').addEventListener('change',togglePickupReturnField);showAvailability();toggleDestinationField();toggleSaleOptions()}if(activeTab==='My branch sales')$('repDate').addEventListener('change',()=>loadSalesForDate($('repDate').value,profile.branch_id).then(rows=>{$('repResults').innerHTML=salesTable(rows.slice().sort(dailySaleCompare),true)}).catch(fail))}
async function filterSales(){const d=$('saleDate').value,b=$('saleBranch').value,raw=$('saleSearch').value;salesDateFilter=d;salesBranchFilter=b;salesSearchFilter=raw;const q=raw.toLowerCase();let source=sales;if(d){let query=db.from('sales').select('*').eq('tenant_id',profile.tenant_id).eq('sale_date',d).order('created_at',{ascending:false}).limit(2000);if(b)query=query.eq('branch_id',b);const r=await query;if(r.error){fail(r.error);return}source=r.data||[];sales=[...sales.filter(s=>s.sale_date!==d),...source]}const rows=source.filter(s=>(!d||s.sale_date===d)&&(!b||s.branch_id===b)&&(!q||[s.customer_name,s.customer_phone,s.product_name,s.product_code,String(s.sale_number)].some(v=>String(v||'').toLowerCase().includes(q))));$('saleResults').innerHTML=salesTable(d?rows.slice().sort(dailySaleCompare):rows.slice().reverse(),Boolean(d))}
async function loadSalesForDate(date,branchId=''){if(!date)return sales;let query=db.from('sales').select('*').eq('tenant_id',profile.tenant_id).eq('sale_date',date).order('created_at',{ascending:false}).limit(2000);if(branchId)query=query.eq('branch_id',branchId);const r=await query;if(r.error)throw r.error;const rows=r.data||[];sales=[...sales.filter(s=>s.sale_date!==date||branchId&&s.branch_id!==branchId),...rows];return rows}

// A sale must identify a person or a destination; the server repeats this validation.
async function recordSale(){
  const button=$('recordSaleBtn');
  let saleSaved=false;
  try{
    if(closures.some(x=>x.business_date===today())||submissions.some(x=>x.user_id===sessionUser.id&&x.business_date===today()))throw new Error('Today is locked. Ask the Admin to reopen it before recording or correcting sales.');
    if(button){button.disabled=true;button.textContent='Recording…'}
    const pid=$('saleProduct').value,p=productById(pid),qty=Number($('saleQty').value),unitPrice=Number($('saleUnitPrice').value);
    const name=$('customerName').value.trim(),destination=$('customerDestination').value.trim();
    const localPhone=$('customerPhone').value.trim(),phone=`+254${localPhone}`,kind=$('kind').value,paid=$('paid').value==='yes';
    const deliveryOption=$('rider').value,otherDelivery=$('otherDeliveryDetails')?.value.trim()||'',rider=kind==='Gas refill'&&!['pickup','other'].includes(deliveryOption)?deliveryOption:'';
    const pickupReturned=kind==='Gas refill'&&deliveryOption==='pickup'&&$('pickupReturned').value==='yes';
    const savedDestination=kind==='Gas refill'&&deliveryOption==='other'?`${destination?`Destination: ${destination} · `:''}Other delivery: ${otherDelivery}`:destination||null;
    if(!p||!Number.isInteger(qty)||qty<1||!Number.isFinite(unitPrice)||unitPrice<0||(!name&&!destination))
      throw new Error('Enter a product, whole quantity, customer name or destination.');
    if(!/^[17]\d{8}$/.test(localPhone))throw new Error('Enter 9 Kenyan mobile digits beginning with 7 or 1. The system adds +254 for you.');
    if(qty>qtyAt(p.id,profile.branch_id))throw new Error('There is not enough stock at your branch.');
    if(kind==='Gas refill'&&!deliveryOption)throw new Error('Choose a delivery assistant or Customer pick-up for this refill.');
    if(kind==='Gas refill'&&deliveryOption==='other'&&!otherDelivery)throw new Error('Describe the Other delivery option before recording this sale.');
    const r=await db.rpc('record_sale_with_price',{p_branch_id:profile.branch_id,p_product_id:p.id,p_kind:kind,
      p_quantity:qty,p_customer_name:name||null,p_customer_phone:phone,p_paid:paid,p_unit_price:unitPrice,
      p_payment_method:paid?$('payMethod').value:null,
      p_payment_reference:paid?$('payRef').value.trim()||null:null,
      p_rider_id:rider||null,p_customer_destination:savedDestination,p_empty_returned:pickupReturned});
    if(r.error)throw r.error;
    saleSaved=true;
    await refresh();toast('Sale recorded · '+String(r.data).slice(0,8));go('New sale');
  }catch(e){fail(e);if(button){button.disabled=saleSaved;button.textContent=saleSaved?'Sale saved · reload':'Record sale'}if(saleSaved)toast('Sale was saved. Reload the page to confirm the latest records.')}
}
